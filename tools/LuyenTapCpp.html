_back(); dq.push_back(L); }\n            if (dq.empty()) continue;\n            while (dq.size() >= 2 && dq[0].eval(S[i]) >= dq[1].eval(S[i])) dq.pop_front();\n            cur[i] = dq[0].eval(S[i]) + S[i] * S[i];\n        }\n        swap(prev, cur);\n    }\n    cout << prev[n] << '\\n';\n}"}]}, {"id": "c12", "title": "Đồ thị nâng cao", "level": "Khó", "desc": "Cầu và khớp, SCC, 2-SAT, Floyd truy vết, chu trình âm, luồng cực đại, ghép cặp.", "items": [{"id": "12.1", "title": "Tìm cầu", "diff": 4, "task": "Dòng 1: n m (≤ 2·10⁵), đồ thị vô hướng có thể có cạnh bội. m dòng u v. In số cầu, dòng sau in các cầu dạng <code>u v<\/code> (u &lt; v) theo thứ tự tăng dần của (u, v).", "input": "5 5\n1 2\n2 3\n3 1\n3 4\n4 5", "output": "2\n3 4\n4 5", "hints": ["Tarjan: low[v] = min(tin[v], tin[u] với cạnh ngược, low[c] với con c). Cạnh (p, v) là cầu khi low[v] > tin[p].", "Cạnh bội: khi duyệt bỏ qua theo chỉ số cạnh đến từ cha, không bỏ qua theo đỉnh cha.", "n lớn và đồ thị có thể là một đường dài: DFS đệ quy sâu 2·10⁵ thường vẫn ổn trên máy chấm, nhưng để an toàn hãy cài bằng stack."], "solution": "// Tarjan tìm cầu, DFS bằng stack — O(n + m)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int n, m; cin >> n >> m; vector<vector<pair<int,int>>> g(n + 1);\n    for (int i = 0; i < m; i++) { int u, v; cin >> u >> v; g[u].push_back({v, i}); g[v].push_back({u, i}); }\n    vector<int> tin(n + 1, 0), low(n + 1, 0), it(n + 1, 0), pe(n + 1, -1); int timer = 0; vector<pair<int,int>> br;\n    for (int s = 1; s <= n; s++) if (!tin[s]) {\n        vector<int> st = {s}; tin[s] = low[s] = ++timer;\n        while (!st.empty()) {\n            int v = st.back();\n            if (it[v] < (int)g[v].size()) {\n                auto [u, id] = g[v][it[v]++];\n                if (id == pe[v]) continue;\n                if (tin[u]) low[v] = min(low[v], tin[u]);\n                else { tin[u] = low[u] = ++timer; pe[u] = id; st.push_back(u); }\n            } else {\n                st.pop_back();\n                if (!st.empty()) { int p = st.back(); low[p] = min(low[p], low[v]); if (low[v] > tin[p]) br.push_back({min(p, v), max(p, v)}); }\n            }\n        }\n    }\n    sort(br.begin(), br.end());\n    cout << br.size() << '\\n'; for (auto &e : br) cout << e.first << ' ' << e.second << '\\n';\n}"}, {"id": "12.2", "title": "Thành phần liên thông mạnh", "diff": 4, "task": "Dòng 1: n m (≤ 2·10⁵), đồ thị có hướng. m dòng u v. In số SCC, rồi với mỗi đỉnh 1..n in chỉ số SCC của nó (đánh số sao cho nếu có cạnh từ SCC a tới SCC b thì chỉ số a &lt; b, tức thứ tự tô-pô của đồ thị nén).", "input": "5 5\n1 2\n2 3\n3 1\n3 4\n4 5", "output": "3\n1 1 1 2 3", "hints": ["Kosaraju: DFS lấy thứ tự kết thúc, rồi DFS trên đồ thị đảo theo thứ tự ngược. Các SCC lấy ra theo thứ tự đó chính là thứ tự tô-pô.", "Cài DFS bằng stack để tránh tràn ngăn xếp với đồ thị dạng đường dài."], "solution": "// Kosaraju với DFS bằng stack — O(n + m)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int n, m; cin >> n >> m; vector<vector<int>> g(n + 1), r(n + 1);\n    for (int i = 0; i < m; i++) { int u, v; cin >> u >> v; g[u].push_back(v); r[v].push_back(u); }\n    vector<int> order, it(n + 1, 0); vector<char> vis(n + 1, 0);\n    for (int s = 1; s <= n; s++) if (!vis[s]) { vector<int> st = {s}; vis[s] = 1; while (!st.empty()) { int v = st.back(); if (it[v] < (int)g[v].size()) { int u = g[v][it[v]++]; if (!vis[u]) { vis[u] = 1; st.push_back(u); } } else { order.push_back(v); st.pop_back(); } } }\n    vector<int> comp(n + 1, 0); int c = 0;\n    for (int i = n - 1; i >= 0; i--) { int s = order[i]; if (comp[s]) continue; c++; vector<int> st = {s}; comp[s] = c; while (!st.empty()) { int v = st.back(); st.pop_back(); for (int u : r[v]) if (!comp[u]) { comp[u] = c; st.push_back(u); } } }\n    cout << c << '\\n'; for (int i = 1; i <= n; i++) cout << comp[i] << (i < n ? ' ' : '\\n');\n}"}, {"id": "12.3", "title": "2-SAT", "diff": 5, "task": "Dòng 1: n m (biến x₁..xₙ, m mệnh đề; ≤ 2·10⁵). m dòng a b: mệnh đề (a ∨ b), số âm nghĩa là phủ định (−3 = ¬x₃). In <code>YES<\/code> và một bộ giá trị 0/1 thỏa mãn, hoặc <code>NO<\/code>.", "input": "3 4\n1 2\n-1 2\n-2 3\n-1 -3", "output": "YES\n0 1 1", "hints": ["Đồ thị kéo theo 2n đỉnh: (a ∨ b) ⇒ ¬a→b và ¬b→a. Vô nghiệm khi x và ¬x cùng SCC.", "Gán x = 1 nếu comp[x] > comp[¬x] theo thứ tự tô-pô của Kosaraju (SCC lấy ra sau thì đứng sau)."], "solution": "// 2-SAT bằng Kosaraju — O(n + m)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int n, m; cin >> n >> m; int N = 2 * n; vector<vector<int>> g(N), r(N);\n    auto id = [&](int a){ return a > 0 ? 2 * (a - 1) : 2 * (-a - 1) + 1; };   // x -> 2i, ¬x -> 2i+1\n    for (int i = 0; i < m; i++) { int a, b; cin >> a >> b; int A = id(a), B = id(b); g[A ^ 1].push_back(B); g[B ^ 1].push_back(A); r[B].push_back(A ^ 1); r[A].push_back(B ^ 1); }\n    vector<int> order, it(N, 0), comp(N, 0); vector<char> vis(N, 0);\n    for (int s = 0; s < N; s++) if (!vis[s]) { vector<int> st = {s}; vis[s] = 1; while (!st.empty()) { int v = st.back(); if (it[v] < (int)g[v].size()) { int u = g[v][it[v]++]; if (!vis[u]) { vis[u] = 1; st.push_back(u); } } else { order.push_back(v); st.pop_back(); } } }\n    int c = 0;\n    for (int i = N - 1; i >= 0; i--) { int s = order[i]; if (comp[s]) continue; c++; vector<int> st = {s}; comp[s] = c; while (!st.empty()) { int v = st.back(); st.pop_back(); for (int u : r[v]) if (!comp[u]) { comp[u] = c; st.push_back(u); } } }\n    for (int i = 0; i < n; i++) if (comp[2*i] == comp[2*i+1]) { cout << \"NO\\n\"; return 0; }\n    cout << \"YES\\n\"; for (int i = 0; i < n; i++) cout << (comp[2*i] > comp[2*i+1] ? 1 : 0) << (i + 1 < n ? ' ' : '\\n');\n}"}, {"id": "12.4", "title": "Phát hiện chu trình âm", "diff": 4, "task": "Dòng 1: n m (n ≤ 2000, m ≤ 10⁴), đồ thị có hướng trọng số nguyên (có thể âm). m dòng u v w. In <code>YES<\/code> và các đỉnh của một chu trình âm theo thứ tự đi, hoặc <code>NO<\/code>.", "input": "4 5\n1 2 1\n2 3 -1\n3 4 -1\n4 2 -1\n1 4 5", "output": "YES\n2 3 4", "hints": ["Bellman-Ford n vòng; nếu vòng thứ n còn cập nhật được đỉnh x thì có chu trình âm. Lùi theo parent n lần từ x để chắc chắn vào trong chu trình, rồi đi theo parent tới khi quay lại.", "Khởi tạo dist = 0 cho mọi đỉnh để bắt được chu trình không tới được từ 1."], "solution": "// Bellman-Ford phát hiện chu trình âm — O(n·m)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    int n, m; cin >> n >> m; vector<array<long long,3>> e(m); for (auto &x : e) cin >> x[0] >> x[1] >> x[2];\n    vector<long long> d(n + 1, 0); vector<int> par(n + 1, -1); int x = -1;\n    for (int i = 0; i < n; i++) { x = -1; for (auto &[u, v, w] : e) if (d[u] + w < d[v]) { d[v] = d[u] + w; par[v] = u; x = v; } if (x < 0) break; }\n    if (x < 0) { cout << \"NO\\n\"; return 0; }\n    for (int i = 0; i < n; i++) x = par[x];\n    vector<int> cyc; for (int v = x;; v = par[v]) { cyc.push_back(v); if (v == x && cyc.size() > 1) break; }\n    cyc.pop_back(); reverse(cyc.begin(), cyc.end());\n    cout << \"YES\\n\"; for (size_t i = 0; i < cyc.size(); i++) cout << cyc[i] << (i + 1 < cyc.size() ? ' ' : '\\n');\n}"}, {"id": "12.5", "title": "Luồng cực đại", "diff": 5, "task": "Dòng 1: n m s t (n ≤ 500, m ≤ 10⁴). m dòng u v c: cung u→v sức chứa c ≤ 10⁹. In luồng cực đại từ s tới t.", "input": "4 5 1 4\n1 2 3\n1 3 2\n2 3 1\n2 4 2\n3 4 3", "output": "5", "hints": ["Dinic: BFS xây đồ thị tầng, DFS tìm đường tăng chặn với con trỏ hiện tại. Lưu cạnh ngược có sức chứa 0.", "Cạnh bội u→v nhiều lần vẫn thêm riêng từng cạnh."], "solution": "// Dinic — O(V^2 E), nhanh trong thực tế\n#include <bits/stdc++.h>\nusing namespace std;\nstruct Dinic {\n    struct E { int to; long long cap; };\n    int n; vector<E> e; vector<vector<int>> g; vector<int> lv, it;\n    Dinic(int n) : n(n), g(n + 1), lv(n + 1), it(n + 1) {}\n    void add(int u, int v, long long c){ g[u].push_back(e.size()); e.push_back({v, c}); g[v].push_back(e.size()); e.push_back({u, 0}); }\n    bool bfs(int s, int t){ fill(lv.begin(), lv.end(), -1); queue<int> q; q.push(s); lv[s] = 0; while (!q.empty()) { int v = q.front(); q.pop(); for (int id : g[v]) if (e[id].cap > 0 && lv[e[id].to] < 0) { lv[e[id].to] = lv[v] + 1; q.push(e[id].to); } } return lv[t] >= 0; }\n    long long dfs(int v, int t, long long f){ if (v == t) return f; for (int &i = it[v]; i < (int)g[v].size(); i++) { int id = g[v][i]; int u = e[id].to; if (e[id].cap > 0 && lv[u] == lv[v] + 1) { long long d = dfs(u, t, min(f, e[id].cap)); if (d > 0) { e[id].cap -= d; e[id ^ 1].cap += d; return d; } } } return 0; }\n    long long maxflow(int s, int t){ long long fl = 0; while (bfs(s, t)) { fill(it.begin(), it.end(), 0); long long f; while ((f = dfs(s, t, LLONG_MAX)) > 0) fl += f; } return fl; }\n};\nint main(){\n    int n, m, s, t; cin >> n >> m >> s >> t; Dinic d(n);\n    for (int i = 0; i < m; i++) { int u, v; long long c; cin >> u >> v >> c; d.add(u, v, c); }\n    cout << d.maxflow(s, t) << '\\n';\n}"}, {"id": "12.6", "title": "Ghép cặp cực đại hai phía", "diff": 4, "task": "Dòng 1: n m k (n công nhân, m việc, k cặp có thể làm; n, m ≤ 10⁴, k ≤ 10⁵). k dòng i j: công nhân i làm được việc j. In số việc nhiều nhất được giao, mỗi người một việc và mỗi việc một người.", "input": "3 3 4\n1 1\n1 2\n2 1\n3 3", "output": "3", "hints": ["Thuật toán Kuhn (đường tăng) O(V·E) đủ cho giới hạn này nếu tối ưu: thử ghép tham lam trước, dùng mảng visited theo dấu thời gian.", "Giới hạn lớn hơn thì cần Hopcroft–Karp O(E√V), hoặc Dinic."], "solution": "// Hopcroft–Karp — O(E·sqrt(V))\n#include <bits/stdc++.h>\nusing namespace std;\nint n, m; vector<vector<int>> g; vector<int> mu, mv, dist;\nbool bfs(){ queue<int> q; bool found = false; for (int u = 1; u <= n; u++) { if (!mu[u]) { dist[u] = 0; q.push(u); } else dist[u] = -1; }\n    while (!q.empty()) { int u = q.front(); q.pop(); for (int v : g[u]) { int w = mv[v]; if (!w) found = true; else if (dist[w] < 0) { dist[w] = dist[u] + 1; q.push(w); } } } return found; }\nbool dfs(int u){ for (int v : g[u]) { int w = mv[v]; if (!w || (dist[w] == dist[u] + 1 && dfs(w))) { mu[u] = v; mv[v] = u; return true; } } dist[u] = -1; return false; }\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int k; cin >> n >> m >> k; g.assign(n + 1, {}); mu.assign(n + 1, 0); mv.assign(m + 1, 0); dist.assign(n + 1, 0);\n    for (int i = 0; i < k; i++) { int a, b; cin >> a >> b; g[a].push_back(b); }\n    int res = 0; while (bfs()) for (int u = 1; u <= n; u++) if (!mu[u] && dfs(u)) res++;\n    cout << res << '\\n';\n}"}]}, {"id": "c13", "title": "Bài tổng hợp (kiểu đề thi)", "level": "Khó", "desc": "Mỗi bài cần kết hợp 2–3 kỹ thuật, có subtask. Đọc kỹ ràng buộc trước khi chọn thuật toán.", "items": [{"id": "13.1", "title": "Giá trị thứ k trên đường đi", "diff": 5, "task": "Cây n đỉnh (≤ 10⁵), đỉnh i có giá trị aᵢ. q truy vấn (≤ 10⁵) u v k: in giá trị nhỏ thứ k trên đường đi từ u tới v (kể cả hai đầu, bảo đảm k ≤ số đỉnh trên đường).<br>Dòng 1: n q. Dòng 2: a₁..aₙ. n−1 dòng cạnh. q dòng u v k.<br><b>Subtask:<\/b> 40% n, q ≤ 2000; 100% như trên.", "input": "5 2\n4 1 3 5 2\n1 2\n2 3\n3 4\n3 5\n4 5 2\n1 4 3", "output": "3\n4", "hints": ["40%: với mỗi truy vấn lấy đường đi bằng LCA hoặc DFS rồi sort, O(q·n log n).", "100%: persistent segment tree trên giá trị đã nén, bản root[v] = root[par[v]] + a[v]. Số phần tử ≤ x trên đường (u, v) = cnt(u) + cnt(v) − cnt(lca) − cnt(par[lca]); đi xuống cây tìm thứ k. Cần LCA bằng binary lifting."], "solution": "// Persistent segment tree + LCA binary lifting — O((n+q) log n)\n#include <bits/stdc++.h>\nusing namespace std;\nconst int MAXN = 100005, LOG = 17;\nint n, q, a[MAXN], vals[MAXN], m, up[LOG][MAXN], dep[MAXN], root[MAXN];\nint L[MAXN * 40], R[MAXN * 40], C[MAXN * 40], tot = 0;\nint upd(int prev, int l, int r, int pos){ int x = ++tot; L[x] = L[prev]; R[x] = R[prev]; C[x] = C[prev] + 1; if (l < r) { int mid = (l + r) / 2; if (pos <= mid) L[x] = upd(L[prev], l, mid, pos); else R[x] = upd(R[prev], mid + 1, r, pos); } return x; }\nint query(int u, int v, int lc, int plc, int l, int r, int k){\n    if (l == r) return l;\n    int mid = (l + r) / 2, cnt = C[L[u]] + C[L[v]] - C[L[lc]] - C[L[plc]];\n    if (k <= cnt) return query(L[u], L[v], L[lc], L[plc], l, mid, k);\n    return query(R[u], R[v], R[lc], R[plc], mid + 1, r, k - cnt);\n}\nvector<int> g[MAXN];\nint lca(int u, int v){ if (dep[u] < dep[v]) swap(u, v); for (int j = LOG - 1; j >= 0; j--) if (dep[u] - (1 << j) >= dep[v]) u = up[j][u]; if (u == v) return u; for (int j = LOG - 1; j >= 0; j--) if (up[j][u] != up[j][v]) { u = up[j][u]; v = up[j][v]; } return up[0][u]; }\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    cin >> n >> q; for (int i = 1; i <= n; i++) { cin >> a[i]; vals[i] = a[i]; }\n    sort(vals + 1, vals + n + 1); m = unique(vals + 1, vals + n + 1) - vals - 1;\n    for (int i = 0; i < n - 1; i++) { int u, v; cin >> u >> v; g[u].push_back(v); g[v].push_back(u); }\n    // BFS từ 1: cha, độ sâu, bản persistent\n    vector<int> order = {1}; up[0][1] = 0; dep[1] = 0; root[0] = 0;\n    for (size_t i = 0; i < order.size(); i++) { int v = order[i]; root[v] = upd(root[up[0][v]], 1, m, lower_bound(vals + 1, vals + m + 1, a[v]) - vals); for (int c : g[v]) if (c != up[0][v]) { up[0][c] = v; dep[c] = dep[v] + 1; order.push_back(c); } }\n    for (int j = 1; j < LOG; j++) for (int v = 1; v <= n; v++) up[j][v] = up[j-1][up[j-1][v]];\n    while (q--) { int u, v, k; cin >> u >> v >> k; int lc = lca(u, v); cout << vals[query(root[u], root[v], root[lc], root[up[0][lc]], 1, m, k)] << '\\n'; }\n}"}, {"id": "13.2", "title": "Số cặp đoạn giao nhau có tổng chẵn", "diff": 4, "task": "Cho n đoạn [lᵢ, rᵢ] trên trục số (n ≤ 2·10⁵, tọa độ ≤ 10⁹) và mỗi đoạn có trọng số wᵢ. Đếm số cặp (i &lt; j) sao cho hai đoạn có điểm chung <b>và<\/b> wᵢ + wⱼ chẵn.<br>Dòng 1: n. n dòng l r w.", "input": "4\n1 5 2\n3 8 4\n6 9 1\n2 3 3", "output": "1", "hints": ["Hai đoạn giao nhau ⇔ không phải (rᵢ &lt; lⱼ hoặc rⱼ &lt; lᵢ). Đếm cặp không giao dễ hơn: quét các đoạn theo l tăng dần, với mỗi đoạn đếm số đoạn trước có r &lt; l bằng Fenwick trên r đã nén.", "Tổng chẵn ⇔ cùng tính chẵn lẻ: làm riêng cho nhóm w chẵn và nhóm w lẻ. Kết quả = C(k,2) − số cặp không giao, cộng hai nhóm."], "solution": "// Quét + Fenwick, tách theo tính chẵn lẻ — O(n log n)\n#include <bits/stdc++.h>\nusing namespace std;\nlong long solve(vector<pair<long long,long long>> &s){\n    int k = s.size(); if (k < 2) return 0;\n    vector<long long> rs; for (auto &p : s) rs.push_back(p.second); sort(rs.begin(), rs.end()); rs.erase(unique(rs.begin(), rs.end()), rs.end());\n    int m = rs.size(); vector<int> bit(m + 1, 0);\n    auto add = [&](int i){ for (; i <= m; i += i & -i) bit[i]++; };\n    auto sum = [&](int i){ int r = 0; for (; i > 0; i -= i & -i) r += bit[i]; return r; };\n    sort(s.begin(), s.end()); long long disjoint = 0;\n    for (auto &p : s) { int pos = lower_bound(rs.begin(), rs.end(), p.first) - rs.begin(); disjoint += sum(pos); /* r < l */ add(lower_bound(rs.begin(), rs.end(), p.second) - rs.begin() + 1); }\n    return (long long)k * (k - 1) / 2 - disjoint;\n}\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int n; cin >> n; vector<pair<long long,long long>> ev, od;\n    for (int i = 0; i < n; i++) { long long l, r, w; cin >> l >> r >> w; (w % 2 ? od : ev).push_back({l, r}); }\n    cout << solve(ev) + solve(od) << '\\n';\n}"}, {"id": "13.3", "title": "Đường đi ngắn nhất với k lần miễn phí", "diff": 4, "task": "Đồ thị có hướng n đỉnh, m cạnh trọng số dương (n ≤ 10⁴, m ≤ 5·10⁴), k ≤ 10. Được đi miễn phí tối đa k cạnh (trọng số coi là 0). In chi phí nhỏ nhất từ 1 tới n, hoặc <code>-1<\/code>.<br>Dòng 1: n m k. m dòng u v w.", "input": "4 4 1\n1 2 10\n2 4 10\n1 3 1\n3 4 100", "output": "1", "hints": ["Dijkstra trên đồ thị trạng thái (đỉnh, số lần đã dùng miễn phí): (n+1)·(k+1) trạng thái, mỗi cạnh sinh hai chuyển: trả tiền hoặc miễn phí (nếu còn lượt)."], "solution": "// Dijkstra trên trạng thái (đỉnh, số lượt miễn phí đã dùng) — O((n·k) log + m·k)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int n, m, k; cin >> n >> m >> k; vector<vector<pair<int,long long>>> g(n + 1);\n    for (int i = 0; i < m; i++) { int u, v; long long w; cin >> u >> v >> w; g[u].push_back({v, w}); }\n    const long long INF = LLONG_MAX / 4; vector<vector<long long>> d(n + 1, vector<long long>(k + 1, INF)); d[1][0] = 0;\n    priority_queue<tuple<long long,int,int>, vector<tuple<long long,int,int>>, greater<>> pq; pq.push({0, 1, 0});\n    while (!pq.empty()) {\n        auto [dist, v, used] = pq.top(); pq.pop(); if (dist > d[v][used]) continue;\n        for (auto [u, w] : g[v]) {\n            if (dist + w < d[u][used]) { d[u][used] = dist + w; pq.push({d[u][used], u, used}); }\n            if (used < k && dist < d[u][used + 1]) { d[u][used + 1] = dist; pq.push({dist, u, used + 1}); }\n        }\n    }\n    long long best = *min_element(d[n].begin(), d[n].end()); cout << (best >= INF ? -1 : best) << '\\n';\n}"}, {"id": "13.4", "title": "Số chuỗi con là palindrome sau khi thay đổi", "diff": 5, "task": "Chuỗi s (|s| ≤ 5000, chữ thường). Đếm số cặp (l, r) sao cho s[l..r] có thể thành palindrome bằng cách thay <b>tối đa một<\/b> ký tự.", "input": "abca", "output": "10", "hints": ["Mở rộng từ tâm (2n−1 tâm): với mỗi tâm đếm số bán kính hợp lệ khi được phép sai ≤ 1 cặp. Mở rộng tới cặp sai đầu tiên, rồi tiếp tục tới cặp sai thứ hai. O(n²).", "Chuỗi độ dài lẻ: ký tự giữa không tính cặp."], "solution": "// Mở rộng từ tâm với một lần sai — O(n^2)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    string s; cin >> s; int n = s.size(); long long ans = 0;\n    for (int c = 0; c < 2 * n - 1; c++) {\n        int l = c / 2, r = c / 2 + (c % 2); int bad = 0;\n        while (l >= 0 && r < n) {\n            if (s[l] != s[r]) { if (++bad > 1) break; }\n            ans++; l--; r++;\n        }\n    }\n    cout << ans << '\\n';\n}"}, {"id": "13.5", "title": "Lịch máy: số máy ít nhất và phân công", "diff": 4, "task": "n công việc (≤ 2·10⁵), việc i chạy trong [sᵢ, eᵢ) (nửa mở, tọa độ ≤ 10⁹). Một máy chạy một việc tại một thời điểm. Dòng 1 in số máy ít nhất; dòng 2 in máy được giao cho từng việc (đánh số từ 1), sao cho hợp lệ.<br>Dòng 1: n. n dòng s e.", "input": "4\n1 4\n2 5\n4 6\n5 7", "output": "2\n1 2 1 2", "hints": ["Sắp theo s. Min-heap các máy theo thời điểm rảnh (e). Nếu máy rảnh sớm nhất có e ≤ sᵢ thì tái dùng, ngược lại mở máy mới. Số máy = max số việc chồng nhau.", "Nhớ in theo thứ tự việc ban đầu, không phải thứ tự đã sắp."], "solution": "// Tham lam + min-heap — O(n log n)\n#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int n; cin >> n; vector<array<long long,3>> j(n); for (int i = 0; i < n; i++) { cin >> j[i][0] >> j[i][1]; j[i][2] = i; }\n    sort(j.begin(), j.end()); vector<int> mach(n); int cnt = 0;\n    priority_queue<pair<long long,int>, vector<pair<long long,int>>, greater<>> pq;   // (thời điểm rảnh, máy)\n    for (auto &[s, e, id] : j) {\n        if (!pq.empty() && pq.top().first <= s) { int m = pq.top().second; pq.pop(); mach[id] = m; pq.push({e, m}); }\n        else { mach[id] = ++cnt; pq.push({e, cnt}); }\n    }\n    cout << cnt << '\\n'; for (int i = 0; i < n; i++) cout << mach[i] << (i + 1 < n ? ' ' : '\\n');\n}"}]}]};
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let done=ls.get('cpp:done',{}), cur=ls.get('cpp:cur','home'), q='';
const ALL=DATA.chapters.flatMap(c=>c.items);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2600);}
const lvClass=l=>l==='Cơ bản'?'l1':l==='Trung bình'?'l2':l==='Nâng cao'?'l3':'l4';
const stars=n=>'★'.repeat(n)+'<span>'+'★'.repeat(5-n)+'</span>';
/* tô màu cú pháp C++ đơn giản */
const KW=/\b(int|long|double|float|char|bool|void|string|auto|const|static|struct|class|public|private|virtual|override|return|if|else|for|while|do|switch|case|break|continue|default|new|delete|nullptr|true|false|using|namespace|template|typename|this|operator|unsigned|size_t|vector|map|set|pair|queue|stack|priority_queue|unordered_set|unique_ptr|make_unique|ostream|stringstream|greater|__int128)\b/g;
function hl(src){
  let s=esc(src);
  s=s.replace(/(\/\/[^\n]*)/g,'\x01$1\x02');
  s=s.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;|&#39;(?:\\.|[^&])*?&#39;)/g,'\x03$1\x04');
  s=s.replace(/^(#[^\n]*)/gm,'\x05$1\x06');
  s=s.replace(KW,'<span class="kw">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');
  const strip=c=>c.replace(/<[^>]+>/g,'');
  return s.replace(/\x01([^\x02]*)\x02/g,(m,c)=>'<span class="cm">'+strip(c)+'</span>').replace(/\x03([^\x04]*)\x04/g,(m,c)=>'<span class="str">'+strip(c)+'</span>').replace(/\x05([^\x06]*)\x06/g,(m,c)=>'<span class="pp">'+strip(c)+'</span>');
}
function count(ch){return ch.items.filter(i=>done[i.id]).length;}
function renderNav(){
  const n=Object.keys(done).filter(k=>done[k]).length; $('#pDone').textContent=n; $('#pBar').style.width=(100*n/ALL.length)+'%';
  $('#nav').innerHTML=`<div class="ni ${cur==='home'?'on':''}" data-c="home"><span class="t">🏠 Tổng quan</span></div><div class="sec">Chương</div>`+
    DATA.chapters.map(c=>`<div class="ni ${cur===c.id?'on':''}" data-c="${c.id}"><span class="t">${esc(c.title)}</span><span class="lv ${lvClass(c.level)}">${c.level}</span><span class="c ${count(c)===c.items.length?'done':''}">${count(c)}/${c.items.length}</span></div>`).join('');
}
function renderHome(){
  return `<div class="wrap"><div class="intro"><h2>Cách luyện tập</h2><ol>
    <li>Đọc đề, tự viết chương trình trong IDE của bạn (Code::Blocks, Dev-C++, VS Code + g++, hoặc <a href="https://www.onlinegdb.com/online_c++_compiler" target="_blank">OnlineGDB</a> nếu không cài được).</li>
    <li>Chạy thử với <b>ví dụ vào</b>, so với <b>ví dụ ra</b>. Tự nghĩ thêm trường hợp biên: 0, số âm, n = 1, dữ liệu lớn.</li>
    <li>Bí thì mở <b>Gợi ý</b> trước, chỉ xem <b>Lời giải mẫu</b> sau khi đã làm được hoặc đã thử ít nhất 20 phút.</li>
    <li>Làm xong tích ✓ <b>Đã làm</b>. Tiến độ lưu trong trình duyệt; bấm <b>Sao lưu</b> để giữ lại.</li></ol>
    <p style="margin:10px 0 0;color:var(--muted)">Chương 9–13 (mức <b>Khó</b>) là bài kiểu thi đấu: giới hạn lớn, cần đúng thuật toán và độ phức tạp, lời giải mẫu ghi rõ độ phức tạp ở dòng đầu. Độ khó ★ đến ★★★★★. Mỗi chương nên làm hết bài ★–★★ trước khi sang chương sau. Biên dịch với <code>g++ -std=c++17 -Wall bai.cpp -o bai</code>.</p></div>
    <div class="cards">${DATA.chapters.map(c=>`<div class="card" data-c="${c.id}"><b>${esc(c.title)}<span class="lv ${lvClass(c.level)}">${c.level}</span></b><p>${esc(c.desc)}</p><div class="bar"><i style="width:${100*count(c)/c.items.length}%"></i></div><small>${count(c)}/${c.items.length} bài</small></div>`).join('')}</div></div>`;
}
function renderEx(it){
  const d=!!done[it.id];
  return `<div class="ex ${d?'done':''}" id="ex-${it.id}"><div class="eh" data-t="${it.id}"><span class="id">${it.id}</span><h3>${esc(it.title)}</h3><span class="stars" title="Độ khó ${it.diff}/5">${stars(it.diff)}</span>
    <label class="chk" onclick="event.stopPropagation()"><input type="checkbox" data-done="${it.id}" ${d?'checked':''}>Đã làm</label></div>
    <div class="eb" ${open.has(it.id)?'':'hidden'}><div class="task">${it.task}</div>
    <div class="io"><div><b>Ví dụ vào</b><pre>${esc(it.input)}</pre></div><div><b>Ví dụ ra</b><pre>${esc(it.output)}</pre></div></div>
    ${it.hints.length?`<details><summary>Gợi ý (${it.hints.length})</summary><div class="in"><ul>${it.hints.map(h=>`<li>${h}</li>`).join('')}</ul></div></details>`:''}
    <details class="sol"><summary>Lời giải mẫu</summary><div class="in"><button class="btn sm copy" data-copy="${it.id}">Sao chép</button><pre class="code">${hl(it.solution)}</pre></div></details></div></div>`;
}
const open=new Set();
function renderChapter(c){
  const qq=q.trim().toLowerCase(), items=c.items.filter(i=>!qq||(i.id+' '+i.title+' '+i.task).toLowerCase().includes(qq));
  return `<div class="wrap"><div class="chead"><h1>${esc(c.title)}<span class="lv ${lvClass(c.level)}">${c.level}</span></h1><p>${esc(c.desc)}</p></div>
    <div class="tools"><input type="search" id="q" placeholder="Tìm trong chương…" value="${esc(q)}"><button class="btn sm" id="bOpen">Mở tất cả</button><button class="btn sm" id="bClose">Thu gọn</button><span style="flex:1"></span><span style="color:var(--muted);font-size:12.5px">${count(c)}/${c.items.length} đã làm</span></div>
    ${items.length?items.map(renderEx).join(''):'<div class="empty">Không có bài nào khớp.</div>'}</div>`;
}
function render(){
  renderNav(); const el=$('#content'); const st=el.scrollTop;
  const c=DATA.chapters.find(x=>x.id===cur);
  el.innerHTML=c?renderChapter(c):renderHome(); el.scrollTop=st;
  if($('#q')){$('#q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p);};}
  if($('#bOpen')) $('#bOpen').onclick=()=>{c.items.forEach(i=>open.add(i.id));render();};
  if($('#bClose')) $('#bClose').onclick=()=>{open.clear();render();};
}
$('#nav').onclick=e=>{const n=e.target.closest('[data-c]');if(n){cur=n.dataset.c;q='';ls.set('cpp:cur',cur);render();$('#content').scrollTop=0;}};
$('#content').addEventListener('click',e=>{
  const card=e.target.closest('.card[data-c]'); if(card){cur=card.dataset.c;ls.set('cpp:cur',cur);render();$('#content').scrollTop=0;return;}
  const h=e.target.closest('.eh'); if(h&&!e.target.closest('.chk')){const id=h.dataset.t;open.has(id)?open.delete(id):open.add(id);const b=h.nextElementSibling;b.hidden=!open.has(id);return;}
  const cp=e.target.closest('[data-copy]'); if(cp){const it=ALL.find(i=>i.id===cp.dataset.copy);navigator.clipboard.writeText(it.solution).then(()=>toast('Đã sao chép lời giải '+it.id));}
});
$('#content').addEventListener('change',e=>{const c=e.target.closest('[data-done]');if(!c)return;done[c.dataset.done]=c.checked;if(!c.checked)delete done[c.dataset.done];ls.set('cpp:done',done);const ex=c.closest('.ex');ex.classList.toggle('done',c.checked);renderNav();});
$('#bTheme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;ls.set('cpp:theme',t);};
$('#bExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'cpp',done})],{type:'application/json'}));a.download='TienDo_CPP.json';a.click();};
$('#fImp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='cpp')throw 0;Object.assign(done,d.done||{});ls.set('cpp:done',done);render();toast('Đã khôi phục tiến độ');}catch(x){toast('File không hợp lệ');}};
render();
</script>
</body>
</html>
