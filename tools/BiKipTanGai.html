<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8456b">

<script>try{var t=localStorage.getItem('bk:theme');t=t?JSON.parse(t):(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}</script>
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --bg:#fff5f6;--surface:#fff;--surface-2:#fff0f2;--border:#f3d3da;--text:#2a1820;--muted:#8a6b75;
 --accent:#e8456b;--accent-2:#ff8a5c;--accent-soft:#ffe3ea;--ok:#1f9d63;--bad:#d4433b;--warn:#c77700;
 --shadow:0 2px 10px rgba(232,69,107,.10)}
[data-theme=dark]{--bg:#17101a;--surface:#221826;--surface-2:#2b1f30;--border:#3d2c44;--text:#f3e8ee;--muted:#b39aa6;
 --accent:#ff6b8e;--accent-2:#ff9a70;--accent-soft:rgba(255,107,142,.16);--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f0a73a;--shadow:none}
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:15px/1.55 var(--font);color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
.app{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:620px;margin:0 auto;background:var(--bg)}
header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 16px 10px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2))}
header h1{margin:0;font-size:18px;flex:1;letter-spacing:.01em}
header small{display:block;font-weight:400;font-size:11.5px;opacity:.9}
.hbtn{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center}
main{flex:1;min-height:0;overflow:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--sab)}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;cursor:pointer;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button i{font-style:normal;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:600}
h2{font-size:17px;margin:18px 0 8px}
h2:first-child{margin-top:2px}
.sub{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.line{font-size:15.5px}
.why{margin-top:6px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent-soft);padding-left:8px}
.acts{display:flex;gap:6px;margin-top:9px;align-items:center}
.acts .tag{font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:10px;margin-right:auto}
.ib{border:1px solid var(--border);background:var(--surface);border-radius:9px;height:32px;min-width:38px;padding:0 9px;cursor:pointer;font-size:13px}
.ib:active{transform:scale(.95)}
.ib.fav{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(232,69,107,.28)}
.hero .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.hero .q{font-size:18px;line-height:1.5;margin:8px 0 12px;font-weight:600}
.hero .row{display:flex;gap:8px;flex-wrap:wrap}
.hero button{border:0;border-radius:10px;height:36px;padding:0 13px;cursor:pointer;background:rgba(255,255,255,.24);color:#fff;font-weight:600;font-size:13px}
.hero button.w{background:#fff;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;cursor:pointer;box-shadow:var(--shadow)}
.tile i{font-style:normal;font-size:24px}
.tile b{display:block;margin-top:4px}
.tile span{font-size:12px;color:var(--muted)}
.gold{background:var(--surface-2);border:1px dashed var(--accent);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13.5px}
.name{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.name input,.search{flex:1;height:38px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--surface);min-width:0;width:100%}
.search{margin-bottom:10px}
.tip h3{margin:0 0 4px;font-size:15.5px}
.tip p{margin:0;font-size:14px}
.tip .ex{margin-top:7px;font-size:13px;background:var(--surface-2);border-radius:9px;padding:7px 10px}
.tip .ex b{color:var(--ok)}.tip .ex s{color:var(--bad);text-decoration:none}
ul.list{margin:0;padding-left:20px}ul.list li{margin:5px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .card h3{margin:0 0 6px;font-size:14px}
.good h3{color:var(--ok)}.badc h3{color:var(--bad)}
.qz .sit{font-size:16px;font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font-size:14.5px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.expl{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:9px 11px;margin:4px 0 10px}
.pbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:12px}.pbar i{display:block;height:100%;background:var(--accent);transition:.3s}
.big{display:block;width:100%;height:44px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.score{text-align:center;padding:26px 10px}.score .n{font-size:46px;font-weight:800;color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#2a1820;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
@media(max-width:380px){.cols{grid-template-columns:1fr}}
</style>
</head>

{q:"Bạn muốn mời cô ấy đi chơi. Câu nào tốt nhất?",o:["“Thứ bảy này 3 giờ chiều anh định đi cà phê sách ở Hồ Tây, em đi cùng nhé?”","“Hôm nào rảnh mình đi cà phê nhé.”","“Em muốn đi đâu cũng được, tùy em hết.”"],e:"Lời mời cụ thể cho thấy bạn nghiêm túc và giúp cô ấy dễ trả lời. Lời mời mơ hồ thường trôi mất."},
{q:"Cô ấy trả lời: “Tuần này em bận rồi.”",o:["“Không sao. Tuần sau em rảnh hôm nào thì báo anh nhé.” Rồi để cô ấy chủ động.","Hỏi dồn: bận gì, với ai, mấy giờ xong.","Giận, không nhắn nữa và đăng status bóng gió."],e:"Nếu cô ấy quan tâm, cô ấy sẽ đề xuất ngày khác. Nếu không, bạn đã có câu trả lời mà không ai phải khó xử."},
{q:"Buổi hẹn đầu tiên, nên nói chuyện thế nào?",o:["Hỏi về cô ấy, lắng nghe, rồi chia sẻ chuyện của mình qua lại.","Kể hết thành tích, lương, kế hoạch mua nhà để gây ấn tượng.","Tâm sự chuyện người yêu cũ để cô ấy hiểu mình."],e:"Buổi hẹn đầu là để hai người thấy dễ chịu khi ở cạnh nhau. Khoe khoang hay than về người cũ đều làm không khí nặng nề."},
{q:"Bạn muốn khen cô ấy.",o:["“Anh thích cách em kể chuyện, nghe rất cuốn.”","“Em xinh hơn mấy đứa bạn em nhiều.”","“Em mà gầy đi chút nữa là hoàn hảo.”"],e:"Lời khen cụ thể về con người cô ấy đáng nhớ nhất. So sánh với người khác hay khen kèm chê đều phản tác dụng."},
{q:"Bạn nhắn tin từ hôm qua, cô ấy chưa trả lời.",o:["Chờ. Vài ngày sau nhắn một tin nhẹ có nội dung mới. Nếu vẫn im lặng thì dừng.","Gửi “???” rồi “Em bận gì mà không trả lời?”","Gọi điện liên tục cho tới khi cô ấy nghe máy."],e:"Ai cũng có lúc bận. Dồn dập khiến bạn trông thiếu kiên nhẫn, còn im lặng kéo dài sau tin thứ hai thì chính là câu trả lời."},
{q:"Cô ấy kể hôm nay bị sếp mắng, rất buồn.",o:["Lắng nghe, rồi hỏi: “Em muốn anh nghe thôi hay muốn anh góp ý?”","Đưa ngay năm giải pháp để xử lý sếp.","“Thế đã là gì, anh còn bị nặng hơn nhiều.”"],e:"Nhiều khi người ta chỉ cần được nghe. Hỏi cô ấy cần gì là cách quan tâm tinh tế nhất."},
{q:"Buổi hẹn đầu sắp kết thúc, bạn rất muốn nắm tay cô ấy.",o:["Để ý xem cô ấy có thoải mái không, và hỏi nhẹ: “Anh nắm tay em được không?”","Cứ nắm, con gái thích sự quyết đoán.","Rủ cô ấy uống thêm vài ly cho dễ nói chuyện."],e:"Hỏi trước không làm mất đi sự lãng mạn, mà cho thấy bạn tôn trọng cô ấy. Ép uống là hành vi không thể chấp nhận."},
{q:"Sau buổi hẹn đầu vui vẻ, nên nhắn gì?",o:["Tối đó nhắn: “Hôm nay anh vui lắm. Em về tới nhà chưa?”","Chờ đúng ba ngày mới nhắn cho có giá.","Nhắn ngay: “Anh nghĩ anh yêu em rồi.”"],e:"Nhắn sớm, chân thành, ngắn gọn. Luật “ba ngày” chỉ làm cô ấy nghĩ bạn không hứng thú, còn tỏ tình ngay thì quá vội."}
];

/* ================= ỨNG DỤNG ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let view='home', favs=ls.get('bk:favs',[]), name=ls.get('bk:name','');
let cat=Object.keys(THINH)[0], talkTab='open', topicCat=Object.keys(TOPICS)[0], q='', heroLine='';
let quiz=null;
const fill=s=>s.replace(/\{ten\}/g,name||'[tên bạn]');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600);}
const ALL_LINES=()=>[...Object.entries(THINH).flatMap(([c,a])=>a.map(t=>({t,tag:c}))),...OPENERS.flatMap(o=>o.l.map(([t,w])=>({t,w,tag:o.s}))),...Object.entries(TOPICS).flatMap(([c,a])=>a.map(t=>({t,tag:c}))),...JOKES.map(([h,t])=>({t,tag:'Chuyện vui: '+h}))];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function lineCard(t,o={}){
  const f=favs.includes(t);
  return `<div class="card"><div class="line">${esc(fill(t))}</div>${o.w?`<div class="why">${esc(o.w)}</div>`:''}
    <div class="acts">${o.tag?`<span class="tag">${esc(o.tag)}</span>`:'<span style="margin-right:auto"></span>'}
    <button class="ib" data-copy="${esc(t)}" title="Sao chép">⧉ Chép</button><button class="ib ${f?'fav':''}" data-fav="${esc(t)}" title="Lưu">${f?'♥':'♡'}</button></div></div>`;
}
const chips=(arr,cur,attr)=>`<div class="chips">${arr.map(c=>`<button class="chip ${c===cur?'on':''}" data-${attr}="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;

function vHome(){
  if(!heroLine) heroLine=pick(Object.values(THINH).flat());
  const n=Object.values(THINH).flat().length;
  return `<div class="hero"><div class="k">Câu thính hôm nay</div><div class="q">${esc(fill(heroLine))}</div>
      <div class="row"><button class="w" data-hero="next">🎲 Câu khác</button><button data-copy="${esc(heroLine)}">⧉ Sao chép</button><button data-fav="${esc(heroLine)}">${favs.includes(heroLine)?'♥ Đã lưu':'♡ Lưu'}</button></div></div>
    <div class="name"><input id="nm" placeholder="Tên của bạn (để điền vào câu giới thiệu)" value="${esc(name)}" maxlength="20"></div>
    <div class="grid">
      <div class="tile" data-go="thinh"><i>💌</i><b>Thả thính</b><span>${n} câu, 5 phong cách</span></div>
      <div class="tile" data-go="talk"><i>💬</i><b>Mở lời & trò chuyện</b><span>Theo từng tình huống</span></div>
      <div class="tile" data-go="tips"><i>📖</i><b>Bí kíp cốt lõi</b><span>${TIPS.length} nguyên tắc, tín hiệu, lỗi cần tránh</span></div>
      <div class="tile" data-go="quiz"><i>🎯</i><b>Luyện phản xạ</b><span>${QUIZ.length} tình huống thực tế</span></div>
    </div>
    <div class="gold"><b>Nguyên tắc vàng:</b> câu thính chỉ để mở đầu cho vui. Thứ giữ được một cô gái ở lại là sự chân thành, biết lắng nghe và tôn trọng. Cô ấy nói “không” thì dừng lại.</div>
    <h2>Chuyện vui ngẫu nhiên</h2>${(()=>{const j=pick(JOKES);return lineCard(j[1],{tag:j[0]});})()}`;
}
function vThinh(){
  const qq=q.trim().toLowerCase();
  const list=qq?Object.entries(THINH).flatMap(([c,a])=>a.filter(t=>fill(t).toLowerCase().includes(qq)).map(t=>[t,c])):THINH[cat].map(t=>[t,'']);
  return `<input class="search" id="q" type="search" placeholder="Tìm câu thính…" value="${esc(q)}">
    ${qq?'':chips(Object.keys(THINH),cat,'cat')}
    <div class="sub">${qq?`${list.length} kết quả`:`${list.length} câu · bấm ♡ để lưu, ⧉ để chép vào tin nhắn`}</div>
    ${list.length?list.map(([t,c])=>lineCard(t,{tag:c})).join(''):'<div class="empty">Không tìm thấy câu nào.</div>'}`;
}
function vTalk(){
  const tabs=[['open','Mở lời'],['topic','Chủ đề'],['joke','Chuyện vui']];
  let body='';
  if(talkTab==='open') body=OPENERS.map(o=>`<h2>${o.i} ${esc(o.s)}</h2>${o.l.map(([t,w])=>lineCard(t,{w})).join('')}`).join('');
  if(talkTab==='topic') body=chips(Object.keys(TOPICS),topicCat,'tcat')+`<div class="sub">Hỏi để nghe câu trả lời, rồi hỏi tiếp từ điều cô ấy kể. Đừng hỏi liên tục như phỏng vấn.</div>`+TOPICS[topicCat].map(t=>lineCard(t)).join('');
  if(talkTab==='joke') body=`<div class="sub">Kể ngắn, kể tự nhiên, đừng cười trước. Một chuyện là đủ, đừng kể liền ba chuyện.</div>`+JOKES.map(([h,t])=>lineCard(t,{tag:h})).join('');
  return `<div class="chips">${tabs.map(([k,t])=>`<button class="chip ${talkTab===k?'on':''}" data-tab="${k}">${t}</button>`).join('')}</div>${body}`;
}
function vTips(){
  return `<h2>12 nguyên tắc cốt lõi</h2>${TIPS.map(([h,p,ex],i)=>`<div class="card tip"><h3>${i+1}. ${esc(h)}</h3><p>${esc(p)}</p>${ex?`<div class="ex"><b>✓ Nên:</b> ${esc(ex[0])}<br><s>✗ Tránh:</s> ${esc(ex[1])}</div>`:''}</div>`).join('')}
    <h2>Đọc tín hiệu</h2><div class="cols"><div class="card good"><h3>✓ Cô ấy có hứng thú</h3><ul class="list">${SIGNS.good.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card badc"><h3>✗ Nên dừng lại</h3><ul class="list">${SIGNS.bad.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
    <h2>Lỗi cần tránh</h2><div class="card"><ul class="list">${AVOID.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <h2>Ý tưởng buổi hẹn đầu</h2><div class="card"><ul class="list">${DATES.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function newQuiz(){
  const order=QUIZ.map((_,i)=>i).sort(()=>Math.random()-.5);
  quiz={order,i:0,score:0,picked:null,opts:null};
}
function vQuiz(){
  if(!quiz) return `<div class="score"><div style="font-size:44px">🎯</div><h2>Luyện phản xạ</h2><p class="sub" style="margin:6px 0 18px">${QUIZ.length} tình huống thường gặp. Chọn cách xử lý bạn cho là tốt nhất, rồi xem giải thích.</p><button class="big" data-quiz="start">Bắt đầu</button>${ls.get('bk:best',null)!=null?`<p class="sub" style="margin-top:14px">Điểm cao nhất: ${ls.get('bk:best')}/${QUIZ.length}</p>`:''}</div>`;
  if(quiz.i>=quiz.order.length){
    const s=quiz.score,n=QUIZ.length; if(s>(ls.get('bk:best',-1))) ls.set('bk:best',s);
    const msg=s===n?'Xuất sắc. Bạn hiểu rằng tinh tế và tôn trọng mới là bí kíp thật.':s>=n*.7?'Khá tốt. Xem lại vài tình huống sai để tinh tế hơn.':'Đọc lại phần Bí kíp rồi thử lần nữa nhé.';
    return `<div class="score"><div class="n">${s}/${n}</div><p>${msg}</p><button class="big" data-quiz="start" style="margin-top:14px">Làm lại</button></div>`;
  }
  const it=QUIZ[quiz.order[quiz.i]];
  if(!quiz.opts) quiz.opts=it.o.map((t,k)=>({t,ok:k===0})).sort(()=>Math.random()-.5);
  const done=quiz.picked!=null;
  return `<div class="pbar"><i style="width:${100*quiz.i/quiz.order.length}%"></i></div><div class="sub">Tình huống ${quiz.i+1}/${quiz.order.length} · đúng ${quiz.score}</div>
    <div class="qz"><div class="sit">${esc(it.q)}</div>${quiz.opts.map((o,k)=>`<button class="opt ${done?(o.ok?'right':k===quiz.picked?'wrong':''):''}" data-opt="${k}" ${done?'disabled':''}>${esc(o.t)}</button>`).join('')}
    ${done?`<div class="expl">${quiz.opts[quiz.picked].ok?'✓ Chính xác. ':'✗ Chưa hợp lý. '}${esc(it.e)}</div><button class="big" data-quiz="next">${quiz.i+1<quiz.order.length?'Tình huống tiếp':'Xem kết quả'}</button>`:''}</div>`;
}
function vFav(){
  const map=new Map(ALL_LINES().map(x=>[x.t,x]));
  return `<h2>♥ Đã lưu (${favs.length})</h2>${favs.length?favs.map(t=>lineCard(t,map.get(t)||{})).join(''):'<div class="empty">Chưa lưu câu nào.<br>Bấm ♡ ở câu bạn thích để lưu vào đây.</div>'}`;
}
function render(keep){
  const m=$('#main'), st=m.scrollTop;
  m.innerHTML=({home:vHome,thinh:vThinh,talk:vTalk,tips:vTips,quiz:vQuiz,fav:vFav}[view]||vHome)();
  m.scrollTop=keep?st:0;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const qi=$('#q'); if(qi) qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render(true);const n=$('#q');n.focus();n.setSelectionRange(p,p);};
  const nm=$('#nm'); if(nm) nm.onchange=e=>{name=e.target.value.trim();ls.set('bk:name',name);render(true);toast(name?'Đã lưu tên':'Đã xóa tên');};
}
function go(v,fromPop){
  view=v;ls.set('bk:view',v==='fav'?'home':v);q='';render();
  if(fromPop) return;
  try{if(v==='home'){if(history.state&&history.state.v)history.back();}else if(history.state&&history.state.v)history.replaceState({v},'');else history.pushState({v},'');}catch(e){}
}
addEventListener('popstate',e=>{go(e.state&&e.state.v?e.state.v:'home',true);});
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v);};
$('#bFav').onclick=()=>go('fav');
$('#bTheme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;ls.set('bk:theme',t);};
async function copy(t){
  t=fill(t);
  try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(x){}a.remove();}
  toast('Đã sao chép');
}
$('#main').addEventListener('click',e=>{
  const t=e.target;
  let b;
  if((b=t.closest('[data-copy]'))){copy(b.dataset.copy);return;}
  if((b=t.closest('[data-fav]'))){const x=b.dataset.fav;favs=favs.includes(x)?favs.filter(y=>y!==x):[x,...favs];ls.set('bk:favs',favs);toast(favs.includes(x)?'Đã lưu ♥':'Đã bỏ lưu');render(true);return;}
  if((b=t.closest('[data-hero]'))){let n;do{n=pick(Object.values(THINH).flat());}while(n===heroLine);heroLine=n;render(true);return;}
  if((b=t.closest('[data-go]'))){go(b.dataset.go);return;}
  if((b=t.closest('[data-cat]'))){cat=b.dataset.cat;render();return;}
  if((b=t.closest('[data-tab]'))){talkTab=b.dataset.tab;render();return;}
  if((b=t.closest('[data-tcat]'))){topicCat=b.dataset.tcat;render(true);return;}
  if((b=t.closest('[data-quiz]'))){if(b.dataset.quiz==='start')newQuiz();else{quiz.i++;quiz.picked=null;quiz.opts=null;}render();return;}
  if((b=t.closest('[data-opt]'))&&quiz&&quiz.picked==null){quiz.picked=+b.dataset.opt;if(quiz.opts[quiz.picked].ok)quiz.score++;render(true);return;}
});
render();
</script>
</body>
</html>
