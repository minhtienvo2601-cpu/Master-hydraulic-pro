<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bóc tách vật tư</title>
<script>
try{var t=localStorage.getItem('bocvt:theme');t=t?JSON.parse(t):(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --font:"Be Vietnam Pro","Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  --bg:#eef1f5; --surface:#fff; --surface-2:#f6f8fb; --surface-3:#e9edf2;
  --border:#dae0e7; --border-strong:#c2cbd6; --text:#16202c; --muted:#5d6979; --faint:#8b96a4;
  --accent:#0b63c5; --accent-soft:#e6effb; --chrome:#0d1825; --chrome-2:#152335; --chrome-line:#22364d;
  --chrome-text:#e6edf5; --chrome-muted:#8fa2b8;
  --ok:#1b955c; --warn:#d68a00; --bad:#d4433b; --todo:#a2acb9; --sim:#0b8895;
  --sel-row:#eef4fd; --mark-y:#fff4c7; --mark-g:#e1f4ea; --mark-r:#fde6e4;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
[data-theme=dark]{
  --bg:#0a0f15; --surface:#111821; --surface-2:#16202b; --surface-3:#1c2733;
  --border:#243140; --border-strong:#354557; --text:#e1e7ef; --muted:#93a1b3; --faint:#627184;
  --accent:#4a92f0; --accent-soft:rgba(74,146,240,.16); --chrome:#070b10; --chrome-2:#101924; --chrome-line:#1d2a39;
  --ok:#2eb675; --warn:#e6a121; --bad:#ef5a51; --todo:#566476; --sim:#2bb3c0;
  --sel-row:rgba(74,146,240,.09); --mark-y:rgba(255,196,0,.13); --mark-g:rgba(46,182,117,.13); --mark-r:rgba(239,90,81,.14);
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:13px/1.45 var(--font);color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.ic{flex:none;vertical-align:-2px}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:12.5px}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:12.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;height:30px;padding:0 8px;outline:none}
textarea{height:auto;padding:6px 8px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.muted{color:var(--muted)} .sp{flex:1} .err{color:var(--bad)}
.mono{font-family:var(--mono)}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;background:var(--chrome);color:var(--chrome-text);flex:none}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(140deg,#2a7be4,#0a3d7d);display:grid;place-items:center;color:#fff;flex:none}
.b1{font-weight:700;letter-spacing:.08em;font-size:12px}
.b2{font-size:11.5px;color:var(--chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.tb-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.topbar .btn{background:var(--chrome-2);border-color:var(--chrome-line);color:var(--chrome-text)}
.topbar .btn:hover{border-color:#3b5675}
.topbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.dictstat{font-size:11px;color:var(--chrome-muted);font-family:var(--mono);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dictstat b{color:#7fd6a6;font-weight:500}

/* global search */
.gsearch{display:flex;align-items:center;gap:8px;height:32px;flex:1;min-width:220px;max-width:440px;padding:0 10px;margin-left:14px;border:1px solid var(--chrome-line);background:var(--chrome-2);color:var(--chrome-muted);border-radius:7px;cursor:pointer;font-size:12.5px}
.gsearch:hover{border-color:#3b5675;color:var(--chrome-text)}
.gsearch span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--border-strong);border-radius:4px;color:var(--muted);background:var(--surface-2);white-space:nowrap}
.gsearch kbd{border-color:var(--chrome-line);background:transparent;color:var(--chrome-muted)}
.pal{position:fixed;inset:0;z-index:65;background:rgba(8,13,22,.5);display:flex;justify-content:center;align-items:flex-start;padding:7vh 16px 16px}
.pal-box{width:min(900px,100%);max-height:82vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);color:var(--muted)}
.pal-in input{flex:1;border:none!important;box-shadow:none!important;font-size:15px;height:36px;padding:0;background:transparent}
.pal-res{overflow:auto;padding:4px 0 10px;min-height:120px}
.pal-sec{padding:12px 16px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.pal-sec b{font-family:var(--mono);color:var(--text)}
.pal-it{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;border-left:3px solid transparent}
.pal-it.act{background:var(--accent-soft);border-left-color:var(--accent)}
.pal-it .main{flex:1;min-width:0}
.pal-it .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pal-it .l2{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .acts{display:flex;gap:4px;flex:none}
.pal-it .ico2{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--muted)}
.pal-info{padding:7px 16px;font-size:12px;display:flex;gap:10px;align-items:baseline}
.pal-more{padding:6px 16px;font-size:11.5px;color:var(--muted)}
.pal-foot{padding:7px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;background:var(--surface-2)}
.grid tr.flash td{animation:flash 2.6s ease-out}
@keyframes flash{0%,45%{background:color-mix(in srgb,var(--accent) 26%,var(--surface))}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:12px 16px 10px;flex:none}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px 9px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--c)}
.kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
.kpi .v{font-size:21px;font-weight:600;font-family:var(--mono);line-height:1.25;margin-top:1px}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.kpi .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin:5px 0 3px}
.bar>i{display:block;height:100%;background:var(--ok)}

/* tabs */
.tabs{display:flex;gap:2px;padding:0 16px;flex:none;border-bottom:1px solid var(--border)}
.tab{padding:9px 14px 8px;border:none;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center;font-size:12.5px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{background:var(--accent);color:#fff;border-radius:9px;padding:0 7px;font-size:10.5px;font-family:var(--mono);line-height:17px}
main{flex:1;min-height:0;display:flex;background:var(--surface)}
.view{display:none;flex:1;min-width:0;min-height:0}
.view.active{display:flex}
#vSum.active,#vList.active{flex-direction:column}
.divider{width:6px;flex:none;cursor:col-resize;margin:0 -3px;z-index:3;position:relative}
.divider::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.divider:hover::after,.divider.act::after{background:var(--accent)}
.dragging{user-select:none;cursor:col-resize}.dragging iframe{pointer-events:none}

/* tree */
#treePane{width:460px;flex:none;container-type:inline-size;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);min-width:0}
.thead{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}
.thead .search{max-width:none}
#tree{flex:1;overflow:auto;padding:6px 0 20px}
#tree ul{list-style:none;margin:0;padding:0}
#tree ul ul{margin-left:15px;border-left:1px dashed var(--border);padding-left:2px}
.tn{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 2px;margin:1px 6px;cursor:pointer;border-radius:5px;white-space:nowrap;min-width:0}
.tn:hover{background:var(--surface-2)}
.tn.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.caret{width:16px;height:16px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:3px}
.caret:hover{background:var(--surface-3);color:var(--text)}
.caret svg{transition:transform .12s}.caret.open svg{transform:rotate(90deg)}
.st{width:8px;height:8px;border-radius:50%;background:var(--todo);flex:none}
.st.doing{background:var(--warn)}.st.done{background:var(--ok)}
.tn .pos{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:11.5px;flex:none}
.tn .tt{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tn .it{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.mini{display:flex;gap:3px;flex:none}
.mini span{font-size:10px;font-family:var(--mono);padding:0 4px;border-radius:3px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);line-height:15px}
.pbar{width:30px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:var(--ok)}
.files{display:flex;gap:1px;color:var(--border-strong);flex:none}
.files .has{color:var(--muted)}

/* detail */
#detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.dhead{padding:12px 18px 10px;border-bottom:1px solid var(--border);flex:none}
.crumb{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.crumb a{color:var(--accent);cursor:pointer}.crumb a:hover{text-decoration:underline}
.dtitle{display:flex;align-items:center;gap:9px;margin:5px 0 2px;flex-wrap:wrap}
.dtitle h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.dtitle .pos{font-family:var(--mono);color:var(--accent);font-size:16px;font-weight:600}
.tag{font-family:var(--mono);font-size:11px;padding:1px 7px;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{border:none;background:var(--surface);padding:0 11px;height:28px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center;font-size:12px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600}
.seg button i{width:8px;height:8px;border-radius:50%}
.note{width:100%;margin-top:8px;min-height:32px;display:block}
.dbody{flex:1;min-height:0;display:flex}
.pdfpane{flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface-3);min-width:0}
.pdfpane iframe{flex:1;border:0;width:100%;background:#525659}
.bompane{flex:1;min-width:0;display:flex;flex-direction:column}

/* filter + bulk */
.fbar{display:flex;flex-direction:column;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);flex:none}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:190px;max-width:360px}
.search svg{position:absolute;left:9px;top:8px;color:var(--faint)}
.search input{width:100%;padding-left:29px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 9px;border:1px solid var(--border);border-radius:13px;background:var(--surface);cursor:pointer;font-size:11.5px;color:var(--text);font-weight:500}
.chip:hover{border-color:var(--c)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:10.5px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:12px;white-space:nowrap}
.tog input{display:none}
.tog span{width:28px;height:16px;border-radius:8px;background:var(--border-strong);position:relative;transition:.15s;flex:none}
.tog span::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.tog input:checked+span{background:var(--accent)}
.tog input:checked+span::after{left:14px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);font-size:12px;flex:none;min-height:38px}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border-strong)}

/* grid */
.tablewrap{flex:1;min-height:0;overflow:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%}
.grid th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.grid td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;background:var(--surface)}
.grid tr.r td:first-child{box-shadow:inset 3px 0 0 var(--c)}
.grid tr.picked td{background:var(--sel-row)}
.grid tr.m-y td{background:var(--mark-y)}
.grid tr.m-g td{background:var(--mark-g)}
.grid tr.m-r td{background:var(--mark-r)}
.grid tr.r:hover td{filter:brightness(.98)}
[data-theme=dark] .grid tr.r:hover td{filter:brightness(1.12)}
.grid tr.minor td{color:var(--muted)}
.grid tr.minor .d1{font-weight:500}
.grid tr.rev .d1::after{content:" ✓";color:var(--ok);font-weight:700}
.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.pos-c{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.itemc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.itemc .mono{font-size:12px}
input.pick{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0;flex:none}
.d1{font-weight:600}
.d2{color:var(--muted);font-size:11.5px;white-space:pre-line;font-family:var(--mono);margin-top:1px}
.sub{font-size:11px;color:var(--muted)}
.wh{font-size:12px;white-space:nowrap}
.hose{margin-top:5px;display:inline-flex;gap:6px;align-items:center;font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:color-mix(in srgb,#d4433b 9%,var(--surface));color:#b3322b;border:1px solid color-mix(in srgb,#d4433b 22%,transparent)}
.hose.inc{border-style:dashed}
[data-theme=dark] .hose{color:#ff8f86}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text));white-space:nowrap}
.brandt{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.code{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:3px;margin-top:4px;line-height:17px;white-space:nowrap}
.code.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.code.sim{background:color-mix(in srgb,var(--sim) 15%,transparent);color:var(--sim)}
.code.none{background:color-mix(in srgb,var(--bad) 11%,transparent);color:var(--bad)}
.revbtn,.markbtn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--faint);padding:0}
.revbtn:hover,.markbtn:hover{border-color:var(--border-strong);color:var(--text)}
.revbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.markbtn.m-y{color:#b88a00;border-color:#e5bf1d;background:#fff4c7}
.markbtn.m-g{color:var(--ok);border-color:var(--ok);background:var(--mark-g)}
.markbtn.m-r{color:var(--bad);border-color:var(--bad);background:var(--mark-r)}
mark{background:#ffdf5d;color:inherit;border-radius:2px;padding:0 1px}
[data-theme=dark] mark{background:#7a6000}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted currentColor}
a.lnk:hover{border-bottom-style:solid}
.empty{padding:50px 24px;color:var(--muted);text-align:center;line-height:1.8}
.empty .big{font-size:15px;color:var(--text);font-weight:600;margin-bottom:4px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* list view */
.lbar{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px;flex:none}
.hint{font-size:11.5px;color:var(--muted)}
.lst td{padding:6px 6px}
.lst input[type=text],.lst input[type=number],.lst textarea{width:100%;font-size:12px}
.lst input.sugg,.lst textarea.sugg{border-style:dashed;color:var(--muted)}
.lst textarea{min-height:52px;font-size:11.5px}
.len{font-size:10px;font-family:var(--mono);color:var(--faint);text-align:right;margin-top:1px}
.len.over{color:var(--bad);font-weight:600}
.simhint{font-size:10.5px;color:var(--sim);margin-top:2px;cursor:pointer}
.xbtn{width:24px;height:24px;border:none;background:none;color:var(--faint);cursor:pointer;border-radius:4px;display:grid;place-items:center}
.xbtn:hover{background:var(--mark-r);color:var(--bad)}

/* popover, modal, toast */
.popover{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:4px;min-width:180px}
.popover button{display:flex;gap:9px;align-items:center;width:100%;border:none;background:none;padding:7px 9px;border-radius:5px;cursor:pointer;text-align:left;color:var(--text);font-size:12.5px}
.popover button:hover{background:var(--surface-2)}

const idb={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('bocvt',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
 async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
 async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},

/* ================= state ================= */

const MARKS=[['','Không tô màu','transparent'],['y','Vàng: Cần kiểm tra','#f2c200'],['g','Xanh: Đã có mã','#1b955c'],['r','Đỏ: Cần tạo mã mới','#d4433b']];

/* ================= categories, brands ================= */
const CATDEF=[
 {n:'Kẹp ống',c:'#8b96a4',re:/CLAMP|COVER PLATE/,minor:true},

 {n:'Bình tích áp',c:'#b0459c',re:/ACCUMULATOR/},
 {n:'Bơm',c:'#7a52cc',re:/\bPUMP\b/},
 {n:'Động cơ / HGT',c:'#6a4cc0',re:/MOTOR|GEAR\s*BOX|GEARBOX/},
 {n:'Xy lanh',c:'#a8641c',re:/CYLINDER/},
 {n:'Đồng hồ / cảm biến',c:'#0b8895',re:/GAUGE|MANOMETER|SENSOR|SWITCH|TRANSMITTER|THERMOMETER/},
 {n:'Đầu nối / kép',c:'#c88400',re:/UNION|STUD|CONNECTOR|ADAPTER|ELBOW|\bTEE\b|PLUG|NIPPLE|COUPLING|FITTING|REDUCER|TRIPLE-LOK/},
 {n:'Ống cứng',c:'#5f6f82',re:/\bPIPE\b|\bTUBE\b/},
 {n:'Bích',c:'#996a2e',re:/FLANGE/},
 {n:'Gioăng / phớt',c:'#118a7e',re:/SEAL|O-RING|ORING|GASKET/},

];
const CAT_OTHER={n:'Khác',c:'#8b96a4'}, CAT_ASM={n:'Cụm (có thư mục)',c:'#3b4d63'};
const CAT_ORDER=[...CATDEF.map(c=>c.n),CAT_OTHER.n,CAT_ASM.n];
const catByName=n=>CATDEF.find(c=>c.n===n)||(n===CAT_ASM.n?CAT_ASM:CAT_OTHER);

function classify(r){
  const first=(r.type||'').toUpperCase(), t=(first+' '+(r.spec||'')).toUpperCase();
  if(/TRIPLE-LOK|\bEO-?2\b|\bDKO[LS]?\b/.test(t)&&!/HOSE|VALVE|CLAMP/.test(first)) return catByName('Đầu nối / kép');
  for(const c of CATDEF) if(c.re.test(first)) return c;
  for(const c of CATDEF) if(c.re.test(t)) return c;
  return CAT_OTHER;
}
const BRANDS=['GS HYDRO','MP FILTRI','SUN HYDRAULICS','PARKER','REXROTH','BOSCH','HYDAC','STAUFF','EATON','VICKERS','DANFOSS','MOOG','ATOS','DUPLOMATIC','HAWE','BUCHER','WALVOIL','SKF','NOK','TRELLEBORG','HALLITE','ENERPAC','PALL','INTERNORMEN','ARGO','OLAER','VOSS','SWAGELOK','MANULI','GATES','ALFAGOMMA','SEMPERIT','WEBTEC','KRACHT','CASAPPA','MARZOCCHI','YUKEN','DAIKIN','NACHI','KAWASAKI','LINDE','DANIELI','FESTO','SMC','IFM','WIKA','BALLUFF','SIEMENS','ABB','SEW','NORD','FLENDER','STAUBLI','FAG','INA','TIMKEN','LINCOLN','BIJUR','HYDROTECHNIK','WEH','ROEMHELD','KTR','SCHROEDER','BEKA','DROPSA','VOGEL','SUND BIRSTA'];
const BRAND_RE=BRANDS.map(b=>[b,new RegExp('\\b'+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b')]);
const prettyBrand=b=>b.split(' ').map(w=>w.length<=3?w:w[0]+w.slice(1).toLowerCase()).join(' ');
function detectBrand(r){
  const t=((r.type||'')+' '+(r.spec||'')).toUpperCase();
  for(const [b,re] of BRAND_RE) if(re.test(t)) return prettyBrand(b);
  if(/\b(ISO|DIN|SS-EN|EN|SMS)\s*\d/.test(t)) return 'Tiêu chuẩn (ISO/DIN)';

}

/* ================= hose decoding (Parker) ================= */
const DASH={4:['1/4"',6],5:['5/16"',8],6:['3/8"',10],8:['1/2"',12],10:['5/8"',16],12:['3/4"',19],16:['1"',25],20:['1-1/4"',31],24:['1-1/2"',38],32:['2"',50]};
const JIC_TH={4:'7/16',5:'1/2',6:'9/16',8:'3/4',10:'7/8',12:'1-1/16',14:'1-3/16',16:'1-5/16',20:'1-5/8',24:'1-7/8',32:'2-1/2'};
const ORFS_TH={4:'9/16',6:'11/16',8:'13/16',10:'1',12:'1-3/16',16:'1-7/16',20:'1-11/16',24:'2'};
const STYLE={'101':['NPT','T'],'103':['JIC','T'],'106':['JIC','T'],'137':['JIC','C'],'139':['JIC','V'],'1L9':['JIC','V'],'141':['JIC','V'],
  '1JC':['ORFS','T'],'1JM':['ORFS','T'],'1J7':['ORFS','C'],'1J9':['ORFS','V'],'1CA':['DKOL','T'],'1CE':['DKOS','T'],'192':['BSP','T']};
const HOSE_P={'462':{5:400,6:350,8:310,16:210,40:70}}; // chỉ các giá trị đã đối chiếu catalogue; còn lại để "?"
function decodeHose(r){
  const t=((r.type||'')+' '+(r.spec||'')).toUpperCase();
  const m=t.match(/(?:^|[\s,])(\d{3}[A-Z]{0,2})-(\d{1,2})(?=[\s,]|$)/); if(!m) return null;
  const series=m[1], dash=+m[2], base=series.slice(0,3), sz=DASH[dash];
  const Lm=t.match(/L\s*=\s*(\d+)/), L=Lm?+Lm[1]:null;
  const fits=[]; const re=/(?:(\d)\s*X\s*)?([0-9][0-9A-Z]{2})(\d{2})-(\d{1,2})-(\d{1,2})(?!\d)/g; let f;
  while((f=re.exec(t))) fits.push({n:f[1]?+f[1]:0,style:f[2],th:+f[4]});
  const ends=[]; let conn=null;
  for(const x of fits){const s=STYLE[x.style];const k=x.n||(fits.length===1?2:1);for(let i=0;i<k;i++)ends.push(s?s[1]:'?');if(s&&!conn)conn=s[0];}
  if(/JIC/.test(t))conn='JIC';else if(/ORFS/.test(t))conn='ORFS';else if(/DKOS/.test(t))conn='DKOS';else if(/DKOL/.test(t))conn='DKOL';else if(/\bBSP/.test(t)&&!conn)conn='BSP';
  while(ends.length<2)ends.push('?');
  const ord={T:0,C:1,V:2,'?':3}; ends.sort((a,b)=>ord[a]-ord[b]); const endStr=ends.slice(0,2).join('');
  const thDash=fits[0]?fits[0].th:null; let thread='?';
  if(conn==='JIC'){const tm=t.match(/JIC\s*37°?\s*(\d[\d\/\- ]*?)\s*X\s*\d{1,2}\b/);thread='UNF'+(tm?tm[1].trim().replace(/\s+/g,'-'):(JIC_TH[thDash]||'?'));}
  else if(conn==='ORFS')thread='UNF'+(ORFS_TH[thDash]||'?');
  else if(conn==='DKOL'||conn==='DKOS'){const mm=t.match(/M\d{2}\s*X\s*\d(?:[.,]\d)?/);thread=mm?mm[0].replace(/\s/g,'').replace('X','x').replace(',','.'):'M?';}

/* ================= tokens & company code dictionary ================= */
function tokStr(s){
  const out=new Set();
  String(s||'').toUpperCase().replace(/ART\.?\s*NO\.?:?/g,' ').split(/[\s,;()]+/).forEach(w=>{
    w=w.replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g,'');

    out.add(w); const mm=w.match(/^(\d{6,})([A-Z].+)$/); if(mm){out.add(mm[1]);if(mm[2].length>=5)out.add(mm[2]);}

function buildDict(entries,name){

    for(const w of tokStr((e.k||'')+' '+(e.s||'')+' '+(e.l||''))){let a=byTok.get(w);if(!a)byTok.set(w,a=[]);if(a.length<6&&!a.includes(e))a.push(e);}

  for(const w of r.tokens||[]){e=dict.byKey.get(w);if(e)return {code:e.c,kind:'exact',e};}

function parseFolderName(name){
  const s=String(name).replace(/\s+/g,' ').trim();
  let m=s.match(/^(\d{2,4})\s+([^#()]+?)#(\S*)\s*(.*)$/);
  if(m) return {pos:m[1],item:m[2].trim(),rev:m[3]==='-'?'':m[3],title:m[4].replace(/^-\s*/,'').trim(),osp:''};
  /* "014  (See Order Spec) HYDRAULIC CYLINDER": có vị trí nhưng không có mã */
  m=s.match(/^(\d{2,4})\s+\(([^)]*)\)\s*(.*)$/);
  if(m) return {pos:m[1],item:'',rev:'',title:m[3].replace(/^-\s*/,'').trim()||m[2],osp:m[2].trim()};
  m=s.match(/^(\d{2,4})\s+(.+)$/);
  if(m) return {pos:m[1],item:'',rev:'',title:m[2].replace(/^-\s*/,'').trim(),osp:''};
  m=s.match(/^([^#\s]+)#(\S*)\s*(.*)$/);

async function attachFiles(files,target){

function applyFilter(rows,f){
  const q=f.q.trim().toLowerCase(), L=activeList(), br=f.branch?allNodes.find(n=>n.path===f.branch):null;
  return rows.filter(r=>{
    if(f.cats.size&&!f.cats.has(r.cat.n)) return false;
    if(f.hideMinor&&r.cat.minor) return false;
    if(f.noAsm&&r.child) return false;
    if(f.brand&&r.brand!==f.brand) return false;
    if(br&&!(r.node===br||r.node.path.startsWith(br.path+'/'))) return false;
    if(f.st){
      const s=P.rows[r.key]||{}, picked=!!L.items[r.key];
      if(f.st==='todo'&&isHandled(r)) return false;
      if(f.st==='rev'&&!s.rev) return false;
      if(f.st==='sel'&&!picked) return false;
      if(f.st==='nosel'&&picked) return false;
      if('ygr'.includes(f.st)&&f.st.length===1&&s.mark!==f.st) return false;
      if(f.st==='nocode'){const c=codeInfo(r);if(c&&(c.kind==='manual'||c.kind==='exact'))return false;}
    }

    return true;
  });
}

const plainLk=(n,k)=>{const f=k==='draw'?n.drawing:n.report;return f?f.name:'';};
const nodesOf=rows=>{const s=new Set(rows.map(r=>r.node).filter(Boolean));return allNodes.filter(n=>s.has(n));};
function listNodes(L){
  const ps=new Set(Object.entries(L.items).map(([k,sn])=>{const r=rowIndex.get(k);return r?r.node.path:sn.path;}));
  return allNodes.filter(n=>ps.has(n.path));

const withAncestors=nodes=>{const s=new Set();nodes.forEach(n=>{let p=n;while(p){s.add(p);p=p.parent;}});return allNodes.filter(n=>s.has(n));};
function bomSheets(nodes,o){
  const cum=[], bom=[];

    const rows=n.bom||[], m=getMult(n);

      'Số dòng BOM':n.bom&&!n.bomErr?rows.length:n.report?(n.bomErr?'lỗi đọc BOM':'chưa đọc'):'không có BOM',
      'Số dòng đã chọn':rows.filter(o.picked).length,'Bản vẽ lắp':o.lk(n,'draw'),'File BOM':o.lk(n,'bom'),'Trạng thái bóc':STATUS[getProg(n).s][0],'Đường dẫn':n.path});
    rows.forEach(r=>{const c=codeInfo(r);

        'Thông số':(r.spec||'').replace(/\n/g,' | '),'SL/BOM':r.qty,'SL tổng':r.qty!=null?r.qty*m:null,'ĐVT':r.unit,'Ghi chú BOM':r.notes,'KL (kg)':r.weight,

}
function packCtx(kind){
  if(kind==='list'){
    const L=activeList();
    const rows=Object.keys(L.items).map(k=>rowIndex.get(k)).filter(Boolean);
    return {kind,label:`danh sách "${L.name}"`,nodes:listNodes(L),rows,fname:`DS_${safeName(L.name)}_${safeName(root.item||'hoso')}`,sheets:lk=>listSheets(L,lk)};
  }
  const rows=sumRows();
  return {kind,label:'bảng tổng hợp đang hiển thị',nodes:nodesOf(rows),rows,fname:sumFname().replace(/\.xlsx$/,''),sheets:lk=>sumSheets(lk)};
}
const zipSafe=n=>String(n).replace(/#/g,'_').replace(/[\\/:*?"<>|]/g,'_');
const okFile=f=>f&&!f._broken;
function packPlan(ctx,o){
  let nodes=o.all?allNodes.filter(n=>n.drawing||n.report):ctx.nodes;
  if(o.anc&&!o.all) nodes=withAncestors(nodes);
  const items=[];
  for(const n of nodes){
    if(o.draw&&n.drawing) items.push({dir:'BanVe_Lap',f:n.drawing,n,k:'draw'});
    if(o.bom&&n.report) items.push({dir:'BOM',f:n.report,n,k:'bom'});
  }
  if(o.part){const seen=new Set();for(const r of ctx.rows){const c=r.folder;if(c&&c.drawing&&!seen.has(c)){seen.add(c);items.push({dir:'BanVe_ChiTiet',f:c.drawing,n:c,k:'part'});}}}
  const uniq=new Set(items.map(x=>x.f));
  return {nodes,items,size:[...uniq].reduce((a,f)=>a+(f.size||0),0),nFiles:uniq.size};
}

let jszipP=null;
function loadJSZip(){
  if(window.JSZip) return Promise.resolve();
  return jszipP||(jszipP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';sc.onload=res;sc.onerror=()=>{jszipP=null;rej(new Error('Không tải được thư viện nén ZIP (cần mạng Internet).'));};document.head.appendChild(sc);}));
}
async function buildPack(ctx,o){
  const box=$('#modal .modal-box'), say=t=>{if(box)box.innerHTML=`<h3><span class="spin"></span> Đang tạo gói ZIP…</h3><p>${t}</p>`;};
  try{
    say('Đang tải thư viện nén…'); await loadJSZip();
    const zip=new JSZip(), pl=packPlan(ctx,o), at=new Map(), names=new Map(), fail=[];
    let i=0;
    for(const x of pl.items){
      i++; if(i%5===1) say(`Đang đọc file ${i}/${pl.items.length}…`);
      if(at.has(x.f)) continue;
      if(!okFile(x.f)){fail.push([x.dir,x.f.name,x.n.path,'trình duyệt không đọc được (đường dẫn dài / chỉ thấy qua Windows)']);continue;}
      try{await x.f.slice(0,8).arrayBuffer();}catch(e){fail.push([x.dir,x.f.name,x.n.path,errMsg(e)]);continue;}
      let nm=zipSafe(x.f.name), key=x.dir+'/'+nm.toLowerCase();
      const prev=names.get(key);
      if(prev&&prev.size!==x.f.size){let j=2;while(names.has(x.dir+'/'+nm.replace(/(\.pdf)?$/i,` (${j})$1`).toLowerCase()))j++;nm=nm.replace(/(\.pdf)?$/i,` (${j})$1`);key=x.dir+'/'+nm.toLowerCase();}
      const path=x.dir+'/'+nm;
      if(!names.has(key)){names.set(key,x.f);zip.file(path,x.f,{binary:true});}
      at.set(x.f,path);
    }
    const lk=(n,k)=>{const f=k==='draw'?n.drawing:n.report;if(!f)return '';const p=at.get(f);return p?XL(p.split('/').pop(),encodeURI(p)):f.name+(o[k==='draw'?'draw':'bom']?' (không xuất được)':'');};
    const xname=ctx.fname+'.xlsx';
    if(o.xlsx){say('Đang tạo file Excel…');zip.file(xname,writeXlsx(ctx.sheets(lk),xname,{array:true}));}
    zip.file('HUONG_DAN.txt',['Gói xuất từ ứng dụng Bóc tách vật tư — '+new Date().toLocaleString('vi-VN'),'Hồ sơ: '+root.name,'',
      '1. Giải nén cả file ZIP (chuột phải → Extract All) rồi mới mở file Excel.',
      '2. Trong Excel, bấm vào tên file ở cột "Bản vẽ lắp" / "File BOM" để mở PDF.',
      '3. Ký tự # trong tên file được đổi thành _ (Excel không mở được liên kết có dấu #).','',
      'BanVe_Lap: bản vẽ lắp của các cụm · BOM: file ASSEMBLED ITEM REPORT · BanVe_ChiTiet: bản vẽ của từng vật tư',
      `Số file PDF: ${names.size}`].join('\r\n'));
    if(fail.length) zip.file('KHONG_XUAT_DUOC.txt',['Các file sau không đọc được nên không có trong gói:','',...fail.map(f=>f.join('\t'))].join('\r\n'));
    const blob=await zip.generateAsync({type:'blob',compression:'STORE',streamFiles:true},m=>say(`Đang nén… ${Math.round(m.percent)}%`));
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=ctx.fname+'.zip';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),120000);
    closeModal();
    toast(`Đã xuất ZIP: ${names.size} file PDF${o.xlsx?' + Excel':''} (${fmtMB(blob.size)})${fail.length?` · ${fail.length} file không đọc được, xem KHONG_XUAT_DUOC.txt`:''}`);
  }catch(e){
    console.error(e);
    if(box) box.innerHTML=`<h3 class="err">${ic('warn',18)} Không tạo được gói ZIP</h3><p>${esc(errMsg(e))}</p><div class="mfoot"><button class="btn primary" data-close>Đóng</button></div>`;
    box&&box.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  }
}

function guessCols(H){

const errMsg=e=>(e&&(e.name&&e.name!=='Error'?e.name+': ':'')+(e.message||''))||String(e);
function brokenFile(name,err){
  const f=new File([],name);
  Object.defineProperty(f,'arrayBuffer',{value:()=>Promise.reject(err)});
  f._broken=err; return f;
}
function setRel(f,rel){try{Object.defineProperty(f,'webkitRelativePath',{value:rel,configurable:true});}catch(e){}return f;}
function scanMsg(t){$('#tree').innerHTML=`<div class="empty"><span class="spin"></span> ${t}</div>`;}
/* File System Access API (Edge/Chrome): liệt kê cả thư mục rỗng, báo lỗi rõ thư mục nào không mở được */
async function walkDirHandle(h){
  const files=[],dirs=[],errs=[]; let last=0;
  const tick=()=>{if(Date.now()-last>250){last=Date.now();scanMsg(`Đang quét thư mục… ${dirs.length} thư mục, ${files.length} file`);}};
  async function walk(dh,path){
    dirs.push(path); tick();
    const subs=[],fps=[];
    try{for await(const [name,ch] of dh.entries())(ch.kind==='directory'?subs:fps).push([name,ch]);}
    catch(e){errs.push({path,msg:errMsg(e)});}
    await Promise.all(fps.map(async([name,fh])=>{
      let f; try{f=await fh.getFile();}catch(e){f=brokenFile(name,e);}
      files.push(setRel(f,path+'/'+name));
    }));
    for(const [name,ch] of subs) await walk(ch,path+'/'+name);
  }
  await walk(h,h.name);
  return {files,dirs,errs,rootName:h.name};
}
/* kéo thả thư mục (dự phòng khi không có File System Access) */
async function walkEntry(de){
  const files=[],dirs=[],errs=[]; let last=0;
  const readAll=r=>new Promise((res,rej)=>{const out=[];const step=()=>r.readEntries(b=>{if(!b.length)res(out);else{out.push(...b);step();}},e=>{e.partial=out;rej(e);});step();});
  async function walk(d,path){
    dirs.push(path); if(Date.now()-last>250){last=Date.now();scanMsg(`Đang quét thư mục… ${dirs.length} thư mục, ${files.length} file`);}
    let ents=[]; try{ents=await readAll(d.createReader());}catch(e){errs.push({path,msg:errMsg(e)});ents=e.partial||[];}
    for(const c of ents){
      const rel=path+'/'+c.name;
      if(c.isDirectory) await walk(c,rel);
      else{let f;try{f=await new Promise((res,rej)=>c.file(res,rej));}catch(e){f=brokenFile(c.name,e);}files.push(setRel(f,rel));}
    }
  }
  await walk(de,de.name);
  return {files,dirs,errs,rootName:de.name};
}
async function openDirHandle(h){
  scanId++; scanMsg('Đang quét thư mục…');
  try{const r=await walkDirHandle(h);buildTree(r.files,{dirs:r.dirs,errs:r.errs,rootName:r.rootName,handle:h,mode:'fsa'});}
  catch(e){toast('Không quét được thư mục: '+errMsg(e));renderTree();}
}

/* ================= kiểm tra thư mục bị thiếu ================= */
/* Bộ hồ sơ tạo một thư mục cho mỗi dòng BOM. Cụm nào đã có thư mục con khớp BOM thì các dòng còn lại chưa khớp = thiếu thư mục. */
function missOf(n){
  if(!n.bom||!n.bom.length||!n.children.length) return [];
  if(!n.bom.some(r=>r.folder)) return [];
  return n.bom.filter(r=>!r.folder);
}
function folderCheck(){
  const listErr=allNodes.filter(n=>n.listErr), missing=[], orphans=[];
  for(const n of allNodes){
    for(const r of missOf(n)) missing.push({n,r});
    if(n.bom&&n.bom.length&&n.bom.some(r=>r.folder)) for(const c of n.children) if(!n.bom.some(r=>r.folder===c)) orphans.push(c);
  }
  return {listErr,missing,orphans};
}

/* ================= đối chiếu với danh sách thư mục do Windows lập =================
   Trình duyệt không đọc được thư mục/file có đường dẫn đầy đủ quá ~260 ký tự (và có khi
   chỉ thấy thư mục đó TRỐNG, không báo lỗi). PowerShell với tiền tố \\?\ thì không bị giới hạn,
   nên lấy danh sách từ Windows để bổ sung các thư mục trình duyệt bỏ sót. */
const PS_HEAD=String.raw`$b=(Get-Location).ProviderPath;$lp=if($b.StartsWith('\\')){'\\?\UNC\'+$b.Substring(2)}else{'\\?\'+$b};`;
const PS_LIST=PS_HEAD+String.raw`$o=[Environment]::GetFolderPath('Desktop')+'\DanhSachHoSo.txt';Set-Content -LiteralPath $o -Value ('#ROOT '+$b) -Encoding UTF8;Get-ChildItem -LiteralPath $lp -Recurse -Force -ErrorAction SilentlyContinue|ForEach-Object{if($_.PSIsContainer){$_.FullName+'\'}else{$_.FullName}}|Add-Content -LiteralPath $o -Encoding UTF8;"Da luu danh sach: $o"`;
const PS_COPY=PS_HEAD+String.raw`$d='C:\BOM_HS';New-Item -ItemType Directory -Force -Path $d|Out-Null;Get-ChildItem -LiteralPath $lp -Recurse -Force -Filter '*.pdf' -ErrorAction SilentlyContinue|Where-Object{$_.Name -match 'ASSEMBLED\s*ITEM\s*REPORT'}|ForEach-Object{Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $d $_.Name) -Force};"Da chep file BOM vao $d"`;
const ghostErr=()=>new DOMException('Trình duyệt không đọc được file này (chỉ thấy trong danh sách Windows) – thường do đường dẫn quá dài','NotFoundError');
async function applyListingFile(f){
  if(!root){toast('Hãy chọn thư mục gốc trước');return;}
  try{await mergeListing(await f.text(),{store:true});}catch(e){toast('Không đọc được file danh sách: '+errMsg(e));}
}
async function mergeListing(text,o={}){
  if(!root) return;
  text=String(text).replace(/\uFEFF/g,'');
  const rn=root.name, recs=[]; let base='', skipped=0;
  const strip=l=>l.replace(/^\\\\\?\\UNC\\/,'\\\\').replace(/^\\\\\?\\/,'');
  for(let l of text.split(/\r?\n/)){
    l=l.trim(); if(!l) continue;
    const mR=l.match(/^#ROOT\s+(.*)$/); if(mR){base=strip(mR[1].trim());continue;}
    if(l.startsWith('#')) continue;
    l=strip(l);
    const dir=/[\\\/]$/.test(l), segs=l.split(/[\\\/]+/).filter(Boolean);
    const bs=base.split(/[\\\/]+/).filter(Boolean);
    let k=(bs.length&&bs[bs.length-1]===rn&&segs[bs.length-1]===rn)?bs.length-1:segs.indexOf(rn);
    if(k<0){skipped++;continue;}
    recs.push({segs:segs.slice(k),dir});
  }
  if(!recs.length){toast(`Danh sách không chứa thư mục hồ sơ "${rn}" – hãy chạy lệnh trong đúng thư mục hồ sơ`);return;}
  if(base){const bs=base.split(/[\\\/]+/).filter(Boolean);if(bs[bs.length-1]===rn) ls.set(baseKey(),base);}
  const before=new Set(nodeMap.keys()), winDirs=new Set([rn]); let addF=0, files=0;
  for(const x of recs){
    const dp=x.dir?x.segs:x.segs.slice(0,-1); if(!dp.length) continue;
    for(let j=1;j<=dp.length;j++) winDirs.add(dp.slice(0,j).join('/'));
    const n=ensureNode(dp,nodeMap,{ghost:true});
    if(!x.dir){files++;const fn=x.segs[x.segs.length-1];
      if(!nodeHasFile(n,fn)){const f=setRel(brokenFile(fn,ghostErr()),x.segs.join('/'));f._ghost=true;addFileToNode(n,f);addF++;}}
  }
  const added=[...nodeMap.keys()].filter(k=>!before.has(k));
  winList={at:o.at||Date.now(),dirs:winDirs.size,files,addD:added.length,addF,base,skipped,
    gone:[...before].filter(k=>!winDirs.has(k))};
  rebuildAll();
  if(o.store!==false) idb.set('winlist:'+projKey,{text,at:winList.at}).catch(()=>{});
  refreshViews(); if(selected) renderDetail(selected);
  if(!o.quiet||added.length||addF)
    toast(added.length||addF?`Đối chiếu Windows: bổ sung ${added.length} thư mục, ${addF} file trình duyệt không đọc được`:`Đối chiếu Windows: trình duyệt đã đọc đủ ${winDirs.size} thư mục`);
  if(!$('#modal').hidden&&$('#modal .winsec')) openFolderModal();
  if(addF) scanAll();
}
function clearListing(){
  idb.del('winlist:'+projKey).catch(()=>{});
  const drop=n=>{n.children=n.children.filter(c=>!c.ghost);n.children.forEach(drop);
    if(n.report&&n.report._ghost&&!n.repLocal){resetBom(n);n.report=null;}
    if(n.drawing&&n.drawing._ghost&&!n.drawLocal)n.drawing=null;
    n.others=n.others.filter(f=>!f._ghost);};
  drop(root); for(const [k,n] of [...nodeMap]) if(n.ghost) nodeMap.delete(k);
  winList=null; rebuildAll(); if(selected&&selected.ghost) select(root); refreshViews(); toast('Đã bỏ đối chiếu Windows');
}

      </tbody></table></div></details>`:''}
  </div>`;

const squash=s=>String(s||'').toLowerCase().replace(/[\s\-_.\/]/g,'');
function gMatch(hay,q,qs){const h=String(hay).toLowerCase();return h.includes(q)||(qs.length>=3&&squash(hay).includes(qs));}
function chainTxt(n){const a=[];let p=n;while(p){a.unshift(lbl(p));p=p.parent;}return a.join(' › ');}
function flashRow(k){
  requestAnimationFrame(()=>{
    const tr=[...document.querySelectorAll('#bomPane tr.r')].find(t=>t.dataset.k===k); if(!tr) return;
    tr.scrollIntoView({block:'center'}); tr.classList.add('flash'); setTimeout(()=>tr.classList.remove('flash'),2700);
  });
}
function openPalette(){
  const el=$('#pal'); el.hidden=false;
  el.innerHTML=`<div class="pal-box">
    <div class="pal-in">${ic('search',18)}<input id="palQ" type="text" autocomplete="off" spellcheck="false" placeholder="Nhập Item No, model (vd 9C1600S), mã công ty 13 số, tên cụm, tên file…"><kbd>Esc</kbd></div>
    <div class="pal-res" id="palRes"></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> chọn</span><span><kbd>Enter</kbd> tới cụm / dòng BOM</span><span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> mở bản vẽ</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> mở BOM PDF</span><span><kbd>Esc</kbd> đóng</span></div></div>`;
  const inp=$('#palQ'); inp.value=palQ; inp.focus(); inp.select(); runSearch();
  inp.oninput=()=>{palQ=inp.value;runSearch();};
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,palItems.length-1);markAct(true);e.preventDefault();}
    else if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);markAct(true);e.preventDefault();}
    else if(e.key==='Enter'){const it=palItems[palSel];if(it)palGo(it,e.ctrlKey?'draw':e.shiftKey?'bom':'go');e.preventDefault();}
  };
  el.onmousedown=e=>{if(e.target===el)closePalette();};
  const res=$('#palRes');
  res.onclick=e=>{const d=e.target.closest('.pal-it');if(!d)return;const a=e.target.closest('[data-a]');palGo(palItems[+d.dataset.i],a?a.dataset.a:'go');};
  res.onmousemove=e=>{const d=e.target.closest('.pal-it');if(d&&+d.dataset.i!==palSel){palSel=+d.dataset.i;markAct(false);}};
}
function closePalette(){const el=$('#pal');if(!el.hidden){el.hidden=true;el.innerHTML='';}}
function markAct(scroll){document.querySelectorAll('#palRes .pal-it').forEach(d=>{const on=+d.dataset.i===palSel;d.classList.toggle('act',on);if(on&&scroll)d.scrollIntoView({block:'nearest'});});}
function runSearch(){
  const res=$('#palRes'), raw=$('#palQ').value.trim(); palItems=[]; palSel=0;
  if(!root){res.innerHTML='<div class="empty">Hãy chọn thư mục gốc trước.</div>';return;}
  if(raw.length<2){res.innerHTML=`<div class="empty"><div class="big">Tìm nhanh trong toàn bộ hồ sơ</div>Gõ Item No (vd <span class="mono">80043288</span>), model (vd <span class="mono">DR15G5</span>), mã công ty 13 số, tên cụm hoặc tên file.<br>Không phân biệt chữ hoa, bỏ qua dấu cách và gạch nối.</div>`;return;}
  const q=raw.toLowerCase(), qs=squash(raw);
  const rank=(item)=>{const a=squash(item);return a===qs?0:a.startsWith(qs)?1:2;};
  const nodes=allNodes.filter(n=>gMatch([n.pos,n.item,n.title,n.name,n.drawing?n.drawing.name:'',n.report?n.report.name:''].join(' '),q,qs))
    .sort((a,b)=>rank(a.item)-rank(b.item)||a.depth-b.depth);
  const rows=allRows().filter(r=>{const c=codeInfo(r);return gMatch([r.item,r.type,r.spec,r.notes,c&&c.code||'',r.hose?r.hose.short:''].join(' '),q,qs);})
    .sort((a,b)=>rank(a.item)-rank(b.item));
  let dictHits=[];
  if(dict&&dict.entries&&raw.length>=4){for(const e of dict.entries){if(gMatch([e.c,e.k,e.s].join(' '),q,qs)){dictHits.push(e);if(dictHits.length>=5)break;}}}
  const NMAX=40, RMAX=150; let h='';
  const nodeBtns=n=>`<div class="acts"><button class="btn sm" data-a="draw" ${n.drawing?'':'disabled'} title="Mở bản vẽ">${ic('draw',13)} Bản vẽ</button><button class="btn sm" data-a="bom" ${n.report?'':'disabled'} title="Mở BOM PDF">${ic('file',13)} BOM</button></div>`;
  if(nodes.length){
    h+=`<div class="pal-sec">${ic('folder',13)} Cụm / thư mục <b>${nodes.length}</b></div>`;
    nodes.slice(0,NMAX).forEach(n=>{const i=palItems.push({t:'node',n})-1;
      h+=`<div class="pal-it" data-i="${i}"><span class="ico2">${ic('folder',15)}</span><div class="main">
        <div class="l1">${n.pos?`<span class="mono" style="color:var(--accent);font-weight:600">${esc(n.pos)}</span>`:''}<b>${hl(n.title||n.name,raw)}</b><span class="tag">${hl(n.item||'—',raw)}${n.rev?' · Rev '+esc(n.rev):''}</span><span class="st ${getProg(n).s}" title="${STATUS[getProg(n).s][0]}"></span></div>
        <div class="l2">${esc(chainTxt(n))}</div></div>${nodeBtns(n)}</div>`;});
    if(nodes.length>NMAX) h+=`<div class="pal-more">… và ${nodes.length-NMAX} cụm khác, hãy gõ cụ thể hơn.</div>`;
  }
  if(rows.length){
    h+=`<div class="pal-sec">${ic('list',13)} Vật tư trong BOM <b>${rows.length}</b></div>`;
    rows.slice(0,RMAX).forEach(r=>{const i=palItems.push({t:'row',r})-1; const n=r.node, c=codeInfo(r);
      const code=c&&(c.kind==='manual'||c.kind==='exact')?`<span class="code ok">${hl(c.code,raw)}</span>`:c&&c.kind==='similar'?`<span class="code sim">≈ ${hl(c.code,raw)}</span>`:'';
      h+=`<div class="pal-it" data-i="${i}"><span class="badge" style="--c:${r.cat.c};min-width:74px;justify-content:center">${esc(r.cat.n.split(' ')[0]==='Cụm'?'Cụm':r.cat.n)}</span><div class="main">
        <div class="l1"><b class="mono">${hl(r.item||'—',raw)}</b><span>${hl(r.type,raw)}</span>${code}${activeList().items[r.key]?`<span class="tag" style="color:var(--accent)">đã chọn</span>`:''}</div>
        <div class="l2">${r.spec?`<span class="mono">${hl(r.spec.replace(/\n/g,' · '),raw)}</span> · `:''}trong <b>${esc(lbl(n))}</b> · pos <span class="mono">${esc(r.pos)}</span> · SL ${fmt(r.qty)}${getMult(n)!==1?' × '+fmt(getMult(n))+' = '+fmt((r.qty||0)*getMult(n)):''} ${esc(r.unit)}</div></div>
        <div class="acts"><button class="btn sm" data-a="draw" ${n.drawing?'':'disabled'} title="Mở bản vẽ của cụm chứa vật tư này">${ic('draw',13)} Bản vẽ cụm</button><button class="btn sm" data-a="bom" ${n.report?'':'disabled'} title="Mở BOM PDF của cụm">${ic('file',13)} BOM</button></div></div>`;});
    if(rows.length>RMAX) h+=`<div class="pal-more">… và ${rows.length-RMAX} dòng khác. Dùng tab Tổng hợp vật tư để xem hết.</div>`;
  }
  if(dictHits.length){
    h+=`<div class="pal-sec">${ic('db',13)} Trong file mã vật tư</div>`;
    dictHits.forEach(e=>{h+=`<div class="pal-info"><span class="code ok">${hl(e.c,raw)}</span><span class="mono muted">${hl(e.k,raw)}</span><span>${hl(e.s||e.l,raw)}</span></div>`;});
  }
  if(scanning) h+=`<div class="pal-more"><span class="spin"></span> Đang đọc BOM, kết quả có thể chưa đủ.</div>`;
  if(!nodes.length&&!rows.length) h=`<div class="empty"><div class="big">Không tìm thấy "${esc(raw)}"</div>Không có cụm hay dòng BOM nào khớp trong hồ sơ này.</div>`+(dictHits.length?h:'');
  res.innerHTML=h; markAct(false);
}
function palGo(it,a){
  if(!it) return; const n=it.t==='node'?it.n:it.r.node;
  if(a==='draw'){if(n.drawing&&!n.drawing._broken)window.open(drawUrl(n),'_blank');else toast(n.drawing?'Trình duyệt không đọc được bản vẽ này (đường dẫn dài?)':'Cụm này không có bản vẽ');return;}
  if(a==='bom'){if(n.report)window.open(URL.createObjectURL(n.report),'_blank');else toast('Cụm này không có file BOM');return;}
  closePalette(); switchView('vTree');
  if(it.t==='row') focusKey=it.r.key;
  select(n);
}
$('#btnSearch').onclick=openPalette;

/* ================= backup / restore / theme / views ================= */
$('#btnBackup').onclick=()=>{
  if(!root){toast('Chưa chọn hồ sơ');return;} flush();
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'bocvt',v:2,key:projKey,P},null,1)],{type:'application/json'}));
  a.download=`SaoLuu_BocVatTu_${safeName(root.item||'hoso')}.json`; a.click();
};
$('#restoreInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return; if(!root){toast('Hãy chọn thư mục gốc trước khi khôi phục');return;}
  try{
    const d=JSON.parse(await f.text()); const Q=d.P||{progress:d.progress||{}};
    Object.assign(P.progress,Q.progress||{}); Object.assign(P.rows,Q.rows||{}); Object.assign(P.mat,Q.mat||{});
    for(const l of Q.lists||[]){const ex=P.lists.find(x=>x.id===l.id);if(ex){Object.assign(ex.items,l.items);Object.assign(ex.meta,l.meta||{});}else P.lists.push(Object.assign({meta:{}},l));}
    flush(); refreshViews(); toast('Đã khôi phục tiến độ');
  }catch(err){toast('File sao lưu không hợp lệ');}
};
$('#btnTheme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;ls.set('bocvt:theme',t);};
function refreshViews(){
  renderKPI(); renderTabs(); renderTree();
  if(curView==='vTree'&&bomArea) bomArea.draw();
  if(curView==='vSum') renderSummary(); if(curView==='vList') renderListView();
}
function switchView(id){
  curView=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));
  if(id==='vSum') renderSummary(); if(id==='vList') renderListView();
  if(id==='vTree'&&bomArea) bomArea.draw();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.view));
$('#btnDir').onclick=pickRoot;
$('#listInput').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)applyListingFile(f);};
$('#dirInput').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)buildTree(fs,{mode:'input'});};
updReopen();
(()=>{let dc=0; const hasF=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter',e=>{if(!hasF(e)||!$('#modal').hidden)return;dc++;document.body.classList.add('gdrag');});
  window.addEventListener('dragleave',e=>{if(!hasF(e))return;if(--dc<=0){dc=0;document.body.classList.remove('gdrag');}});
  window.addEventListener('dragover',e=>{if(hasF(e))e.preventDefault();});
  window.addEventListener('drop',e=>{
    if(!hasF(e))return;e.preventDefault();dc=0;document.body.classList.remove('gdrag');
    if(!$('#modal').hidden) return;
    /* phải lấy handle / entry ngay trong sự kiện, trước mọi await */
    const items=[...(e.dataTransfer.items||[])].filter(i=>i.kind==='file');
    const hs=items.map(i=>i.getAsFileSystemHandle?i.getAsFileSystemHandle():null);
    const ents=items.map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null);
    const files=[...e.dataTransfer.files];
    (async()=>{
      for(let i=0;i<items.length;i++){
        if(!(ents[i]&&ents[i].isDirectory)) continue;
        const h=hs[i]?await hs[i].catch(()=>null):null;
        if(h&&h.kind==='directory') return openDirHandle(h);
        return openDirEntry(ents[i]);
      }
      const txt=files.find(f=>/\.txt$/i.test(f.name));
      if(txt&&root) return applyListingFile(txt);
      if(root) attachFiles(files); else toast('Hãy thả cả thư mục hồ sơ, hoặc bấm Chọn thư mục gốc');
    })();
  });
})();
renderTree();
$('#detail').innerHTML=`<div class="empty"><div class="big">Bóc tách vật tư từ hồ sơ thiết bị</div>
  1. Bấm <b>Chọn thư mục gốc</b> → chọn thư mục hồ sơ (Edge hỏi quyền xem thì bấm <i>Xem tệp / View files</i>, dữ liệu chỉ đọc trên máy), hoặc <b>kéo thả thư mục</b> vào cửa sổ.<br>
  2. Chọn cụm bên trái để xem BOM. Tích ô <input type="checkbox" checked disabled style="vertical-align:-3px"> sau mã vật tư để đưa vào danh sách.<br>
  3. Sang tab <b>Danh sách đã chọn</b> để nhập mã công ty, tên ngắn/dài và <b>Xuất Excel</b>.</div>`;
renderSummary(); renderListView();
</script>
