# Môi trường chạy thử / staging trên 1 máy. Production: dùng Postgres + object storage được quản lý
# (xem docs/DEPLOYMENT.md) và đặt reverse proxy HTTPS (Caddy/Nginx/Cloud LB) trước dịch vụ "web".
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tj-dev-only}
      POSTGRES_DB: tradejournal
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tj"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tjminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tjminio-dev-only}
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-tjminio} $${MINIO_ROOT_PASSWORD:-tjminio-dev-only}; do sleep 1; done;
             mc mb -p local/tradejournal-images && mc anonymous set none local/tradejournal-images && mc version enable local/tradejournal-images"

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      TJ_ENV: ${TJ_ENV:-development}
      TJ_DATABASE_URL: postgresql+psycopg://tj:${POSTGRES_PASSWORD:-tj-dev-only}@db:5432/tradejournal
      TJ_COOKIE_SECURE: ${TJ_COOKIE_SECURE:-false}
      TJ_STORAGE_BACKEND: s3
      TJ_S3_BUCKET: tradejournal-images
      TJ_S3_ENDPOINT_URL: http://minio:9000
      TJ_S3_REGION: us-east-1
      TJ_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tjminio}
      TJ_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-tjminio-dev-only}

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  minio:
