# Chạy toàn bộ TradeJournal trên 1 máy: docker compose up -d --build → http://localhost:3000
# Ảnh lưu trong volume "uploads". Production: dùng Postgres + object storage S3-compatible được quản lý
# (đặt TJ_STORAGE_BACKEND=s3 và các biến TJ_S3_*, xem docs/DEPLOYMENT.md) và reverse proxy HTTPS trước "web".
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tj-dev-only}
      POSTGRES_DB: tradejournal
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tj"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      TJ_ENV: ${TJ_ENV:-development}
      TJ_DATABASE_URL: postgresql+psycopg://tj:${POSTGRES_PASSWORD:-tj-dev-only}@db:5432/tradejournal
      TJ_COOKIE_SECURE: ${TJ_COOKIE_SECURE:-false}
      TJ_STORAGE_BACKEND: local
      TJ_STORAGE_LOCAL_DIR: /data/uploads
    volumes: [uploads:/data/uploads]

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  uploads:
