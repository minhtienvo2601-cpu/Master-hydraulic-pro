<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#081225">
<title>Bảo Trì Thủy Lực</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <button class="icon-btn" id="btnBack" hidden aria-label="Quay lại"></button>
      <div>
        <div class="tb-eyebrow" id="tbEyebrow">BẢO TRÌ THỦY LỰC</div>
        <h1 id="tbTitle">Tổng quan</h1>
      </div>
    </div>
    <div class="tb-right">
      <button class="icon-btn" id="btnSearch" aria-label="Tìm kiếm"></button>
      <button class="icon-btn" id="btnSettings" aria-label="Cài đặt"></button>
      <button class="icon-btn" id="btnMenu" aria-label="Tùy chọn" hidden></button>
    </div>
  </header>
  <main id="view"></main>
  <button id="fab" aria-label="Thêm"></button>
  <nav id="tabbar">
    <button data-tab="home"></button>
    <button data-tab="journal"></button>
    <button data-tab="notes"></button>
    <button data-tab="parts"></button>
    <button data-tab="tasks" class="dt"></button>
    <button data-tab="devices" class="dt"></button>
    <button data-tab="ref" class="dt"></button>
    <button data-tab="more"></button>
  </nav>
</div>
<div id="sheetRoot"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
